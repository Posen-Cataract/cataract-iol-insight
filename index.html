<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cataract & IOL Insight 文獻庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: navy masthead (brand + author) → hero with search on home → topic cards; paper pages read as a one-column clinical summary sheet. */
:root {
  --navy: #0d2440;
  --navy-2: #163458;
  --accent: #0b7d8f;
  --accent-soft: #e1f1f3;
  --bg: #f3f6f9;
  --surface: #ffffff;
  --ink: #142538;
  --muted: #5a6b7d;
  --line: #d9e2ea;
  --on-navy: #e8f1f8;
  --on-navy-muted: #9fb6cc;
  --gold: #c9a35a;
  --danger: #b4423a;
  --font-body: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #0a1a2e; --navy-2: #122a47; --accent: #43b8c9; --accent-soft: #123640;
    --bg: #0f1822; --surface: #16222f; --ink: #e4ecf3; --muted: #95a8ba; --line: #263749;
    --danger: #e0786f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #0a1a2e; --navy-2: #122a47; --accent: #43b8c9; --accent-soft: #123640;
  --bg: #0f1822; --surface: #16222f; --ink: #e4ecf3; --muted: #95a8ba; --line: #263749;
  --danger: #e0786f; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.7 var(--font-body); }
a { color: var(--accent); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.35; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* Masthead */
.mast { background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); }
.mast .wrap { display: flex; align-items: center; gap: 16px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; margin-right: auto; }
.logo { flex: none; width: 66px; height: 54px; background: #fff; border-radius: 10px; display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line); }
.logo img { height: 48px; width: auto; display: block; }
.brand b { display: block; font-size: 17px; letter-spacing: .01em; }
.brand small { display: block; font-size: 12.5px; color: var(--muted); }
.author { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.45; border-left: 1px solid var(--line); padding-left: 16px; }
.author b { color: var(--ink); font-weight: 600; }
.mode { font-size: 12px; border: 1px solid var(--gold); color: #8a6a2b; border-radius: 999px; padding: 1px 9px; display: inline-block; margin-bottom: 2px; }
.mini-search { flex: 0 1 280px; }
.mini-search input, .hero-search input { width: 100%; border-radius: 10px; border: 1px solid transparent; }
.mini-search input { padding: 7px 12px; background: var(--bg); border-color: var(--line); }

/* Hero */
.hero { background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color: var(--on-navy); }
.hero .wrap { padding-top: 28px; padding-bottom: 36px; display: grid; gap: 16px; }
.hero h1 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 700; max-width: 22em; }
.hero p { margin: 0; color: var(--on-navy-muted); max-width: 40em; }
.hero .ai-note { font-size: 13px; border: 1px solid #2f5178; border-radius: 8px; padding: 6px 12px; justify-self: start; }
.hero-search { max-width: 640px; }
.hero-search input { padding: 13px 16px; font-size: 16px; background: var(--surface); color: var(--ink); }
.hero-stats { display: flex; gap: 28px; flex-wrap: wrap; font-size: 14px; color: var(--on-navy-muted); }
.hero-stats b { color: var(--on-navy); font: 600 22px/1 var(--font-mono); margin-right: 6px; font-variant-numeric: tabular-nums; }

main.wrap { padding-top: 28px; padding-bottom: 56px; display: grid; gap: 32px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 20px; }
.sec-head span { color: var(--muted); font-size: 14px; }
.crumbs { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }

/* Topic cards */
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.topic { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; color: var(--ink); text-decoration: none; align-content: start; border-top: 3px solid var(--accent); }
.topic:hover { box-shadow: 0 6px 22px rgba(13, 36, 64, .10); }
.topic-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.topic h3 { font-size: 20px; }
.topic h3 small { display: block; font: 500 12.5px var(--font-body); color: var(--muted); letter-spacing: .02em; }
.count { font: 600 13px var(--font-mono); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.topic ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13.5px; color: var(--muted); }
.topic li { display: flex; justify-content: space-between; gap: 10px; }
.topic li span:last-child { font-family: var(--font-mono); }
.topic li.zero { opacity: .5; }

/* Recently summarised */
.recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.recent a { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-decoration: none; color: var(--ink); display: grid; gap: 6px; }
.recent a:hover { border-color: var(--accent); }
.recent .k { font-size: 12px; color: var(--accent); font-weight: 600; }
.recent p { margin: 0; font-weight: 500; line-height: 1.55; }

/* Category view */
.cat-title h1 { font-size: 28px; }
.cat-title p { margin: 4px 0 0; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.tabs button span { font: 500 12px var(--font-mono); color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs button[aria-pressed="true"] span { color: rgba(255,255,255,.8); }
.toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: grid; gap: 6px; text-decoration: none; color: var(--ink); }
.item:hover { border-color: var(--accent); }
.item .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.item .lead { font-weight: 600; font-size: 16px; line-height: 1.5; }
.item .en { font-size: 13px; color: var(--muted); line-height: 1.5; }
.item .takeaway { font-size: 14.5px; line-height: 1.6; display: flex; gap: 8px; }
.item .takeaway b { flex: none; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; height: fit-content; margin-top: 2px; }
.chip { border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
.chip.year { font-family: var(--font-mono); }
.chip.wip { border-style: dashed; }
.chip.ok { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.must { background: #f6ecd6; border-color: transparent; color: #7a5a1c; font-weight: 600; }
.guide { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 20px 22px; display: grid; gap: 14px; }
.guide-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.guide h2 { font-size: 16px; color: var(--accent); }
.guide p { margin: 0; }
.guide .hint { color: var(--muted); }
.terms { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.terms div { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.terms dt { font-weight: 600; font-size: 14px; }
.terms dd { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
.must-list h3 { font-size: 14px; margin-bottom: 4px; }
.must-list ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.must-list li span { color: var(--muted); font: 12.5px var(--font-mono); }
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ov { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: grid; gap: 6px; }
.ov:hover { border-color: var(--accent); }
.ov b { font-size: 15px; }
.ov span { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
.ov small { font-size: 12.5px; color: var(--accent); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer; }
.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

/* Paper sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: clip; max-width: 880px; }
.sheet-head { padding: 26px 30px 22px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.sheet-head h1 { font-size: 23px; font-weight: 700; }
.cite { color: var(--muted); font-size: 14px; }
.orig { font-size: 14.5px; line-height: 1.55; color: var(--ink); }
.orig span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 1px; }
.sheet-body { padding: 26px 30px 30px; display: grid; gap: 24px; }
.keypoint { background: var(--navy); color: var(--on-navy); border-radius: 12px; padding: 18px 20px; }
.keypoint small { display: block; color: var(--gold); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; margin-bottom: 4px; }
.keypoint p { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.6; }
.facts { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.facts div { background: var(--surface); padding: 10px 14px; flex: 1 1 190px; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 14.5px; }
.block h2 { font-size: 15px; color: var(--accent); margin-bottom: 6px; }
.block p, .block ul { margin: 0; }
.block ul { padding-left: 20px; display: grid; gap: 4px; }
.ai { display: grid; gap: 12px; }
.ai-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.ai-head h2 { font-size: 17px; }
.badge-ai.reviewed { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.badge-ai { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.layers-note { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.layer { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.layer-head { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.layer-head h2 { font-size: 16px; }
.layer-head h2 small { font: 500 12.5px var(--font-body); color: var(--muted); margin-left: 8px; }
.layer-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.ln { flex: none; width: 28px; height: 28px; border-radius: 50%; font: 600 14px/28px var(--font-mono); text-align: center; color: #fff; }
.layer.evidence .layer-head { background: var(--accent-soft); } .layer.evidence .ln { background: var(--accent); }
.layer.authors .layer-head { background: var(--bg); } .layer.authors .ln { background: var(--navy-2); }
.layer.implication { border-style: dashed; } .layer.implication .ln { background: var(--muted); }
.layer-body { padding: 14px 18px 16px; display: grid; gap: 6px; }
.layer-body h4 { margin: 6px 0 0; font-size: 13.5px; color: var(--accent); }
.layer-body h4:first-child { margin-top: 0; }
.layer-body p, .layer-body ul { margin: 0; }
.layer-body ul { padding-left: 20px; display: grid; gap: 4px; }
.ed-layer { font-size: 15px; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.ed-layer span { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); }
.block.apply { background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; }
.source { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.srcnote { font-size: 13px; color: var(--muted); word-break: break-all; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 14px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.ghost-danger { color: var(--danger); }
.btn:disabled { opacity: .55; cursor: default; }
.localpath { font: 12px/1.5 var(--font-mono); color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.localpath code { flex: 1 1 300px; word-break: break-all; }
.pending { border: 1px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); }
.edited { font-size: 12.5px; color: var(--muted); }

/* Editor */
.editor { display: grid; gap: 16px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13.5px; font-weight: 600; }
.field .hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--bg); line-height: 1.6; }
.field textarea { resize: vertical; min-height: 84px; }
.field.big textarea { font-size: 16px; font-weight: 600; min-height: 70px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; position: sticky; bottom: 0; background: var(--surface); padding: 12px 0 4px; border-top: 1px solid var(--line); }
.status { font-size: 13.5px; color: var(--muted); }
.status.err { color: var(--danger); }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer .wrap { padding-top: 20px; padding-bottom: 28px; display: grid; gap: 4px; }
@media (max-width: 640px) {
  .author { display: none; }
  .mast .wrap { gap: 10px; padding-top: 10px; padding-bottom: 10px; }
  .mini-search { flex: 1 1 100%; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scrollbar-width: none; }
  .tabs button { flex: none; }
  .sheet-head, .sheet-body { padding-left: 18px; padding-right: 18px; }
  .hero .wrap { padding-top: 22px; padding-bottom: 26px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Figures */
.figs { display: grid; gap: 14px; margin-top: 4px; }
.fig { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 12px; background: var(--surface); display: grid; gap: 10px; }
.fig-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.fig-head h5 { margin: 0; font-size: 14.5px; color: var(--ink); }
.fig-kind { font-size: 11.5px; color: var(--muted); white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.fig-cap { margin: 0; font-size: 13.5px; color: var(--ink); line-height: 1.7; }
.layer-body .fig p { max-width: none; }
.fig-zoom + .fig-note { text-align: center; margin-top: -4px; }
.fig-src { margin: 0; font-size: 12px; color: var(--muted); }
.fb { display: grid; gap: 8px; }
.fb-row { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 10px; align-items: center; }
.fb-label { font-size: 13px; color: var(--ink); text-align: right; line-height: 1.3; }
.fb-bars { display: grid; gap: 3px; }
.fb-track { display: flex; align-items: center; gap: 8px; min-height: 18px; }
.fb-fill { height: 16px; border-radius: 0 4px 4px 0; min-width: 2px; }
.fb-val { font-family: var(--font-mono); font-size: 12px; color: var(--ink); white-space: nowrap; }
.fb-na { font-size: 12px; color: var(--muted); }
.fig-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.fig-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.fig svg { width: 100%; height: auto; display: block; }
.fig svg text { font-family: var(--font-body); fill: var(--muted); font-size: 12px; }
.fig svg .v { fill: var(--ink); font-family: var(--font-mono); font-size: 11.5px; }
.fig-table { overflow-x: auto; max-width: 100%; }
.fig, .figs, .figs-wrap { min-width: 0; }
.fig-table th { white-space: nowrap; }
@media (max-width: 600px) { .fig-table table { min-width: 560px; } }
.fig-table table { border-collapse: collapse; width: 100%; font-size: 13px; }
.fig-table th, .fig-table td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.fig-table th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--accent-soft); }
.fig-table td:not(:first-child) { font-family: var(--font-mono); font-size: 12.5px; }
.fig img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); background: #fff; justify-self: center; }
.fig-tools { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.fig-form { border: 1px dashed var(--accent); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.fig-form .row2 { gap: 10px; }
.fig-form .hint, .fig-note { font-size: 12px; color: var(--muted); }
.fig-add { justify-self: start; }
.fig-form [hidden] { display: none !important; }
.fig-form select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
@media (max-width: 600px) { .fb-row { grid-template-columns: 1fr; gap: 3px; } .fb-label { text-align: left; } }
.fig-zoom { all: unset; cursor: zoom-in; justify-self: center; display: block; max-width: 100%; }
.fig-zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.zoom-ov { position: fixed; inset: 0; z-index: 100; background: rgba(5, 12, 22, .92); display: grid; place-items: center; gap: 10px; padding: 16px; cursor: zoom-out; }
.zoom-ov img { max-width: 100%; max-height: calc(100vh - 70px); object-fit: contain; background: #fff; border-radius: 6px; }
.zoom-ov span { color: #cfdbe6; font-size: 13px; }
/* Full-width, justified body text (CJK reads evenly when both edges align) */
@media (min-width: 700px) { .layer-body p, .layer-body li, .guide p, .block p, .block li, .fig-cap { text-align: justify; text-justify: inter-character; } }
@media (max-width: 600px) { .facts div { flex: 1 1 40%; padding: 8px 12px; } .facts dd { font-size: 13.5px; } }
.lockbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
.lockbar.locked { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.unlockf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 400; }
.unlockf input { width: 90px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); letter-spacing: .2em; }
.figs-first { display: grid; gap: 6px; }
@media print {
  body > * { display: none !important; }
  body::before { content: "Cataract & IOL Insight 的內容僅供線上閱讀，請至網站查閱：https://claude.ai/artifact/82a8AZAc6mBKCchJnBfvqQ"; display: block; padding: 40mm 20mm; font: 12pt/1.8 system-ui, sans-serif; color: #142538; }
}
.jump { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; margin: -8px 0 0; background: var(--surface); border-bottom: 1px solid var(--line); }
.jump::-webkit-scrollbar { display: none; }
.jump button { flex: none; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.jump button:hover { border-color: var(--accent); color: var(--accent); }
.jump button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media print { .jump { display: none; } }
.fold > summary, details.layer > summary { list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.fold > summary::-webkit-details-marker, details.layer > summary::-webkit-details-marker { display: none; }
.fold > summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
.fold > summary h4 { margin: 6px 0 0; }
.fold { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.fold:last-child { border-bottom: none; padding-bottom: 0; }
.fold-body { display: grid; gap: 6px; margin-top: 6px; }
.fold > summary:focus-visible, details.layer > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
.chev { flex: none; display: inline-flex; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
.chev::after { content: "展開 ▾"; }
.fold[open] > summary .chev::after, details.layer[open] > summary .chev::after { content: "收合 ▴"; }
details.layer > summary.layer-head { align-items: center; }
details.layer > summary .lh-text { flex: 1; min-width: 0; }
details.layer:not([open]) > summary.layer-head { border-bottom: none; }
summary:hover .chev { color: var(--accent); }
.jump-all { margin-left: auto; color: var(--accent) !important; border-color: var(--accent) !important; }
.share { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cat-title .share { margin-top: 10px; }
.share-out { font-size: 12.5px; color: var(--accent); display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.share-url { font: inherit; font-size: 12px; width: min(420px, 80vw); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.fig-ref { margin: 0; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px; font-size: 13px; color: var(--muted); }
.hero-live { display: inline-block; margin-left: 10px; padding: 1px 10px; border-radius: 999px; font-size: 0.85em; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); white-space: nowrap; vertical-align: 1px; }
</style>

<script id="catalog" type="application/json">{"updated": "2026-11-11", "categories": [{"id": "01", "en": "Optical Design", "zh": "光學設計", "subs": [{"id": "01", "en": "Image Quality", "zh": "球差、MTF/PSF、瞳孔、色差", "intro": "IOL 的成像品質取決於它和角膜像差的搭配。角膜通常帶有正球差，非球面 IOL 以零或負球差設計來中和，目的是提升對比敏感度，在瞳孔較大時差異更明顯。不同族群的角膜球差分佈不同，選擇非球面設計時可以參考本地族群的資料。", "terms": ["球差（SA）：光線通過鏡片邊緣與中央的聚焦位置不同，瞳孔越大影響越明顯", "MTF：調制轉換函數，描述鏡片把不同細緻度的影像傳遞出來的能力", "Strehl ratio：實際成像峰值與理想成像的比值，越接近 1 越好"]}, {"id": "02", "en": "Positioning & Edge", "zh": "傾斜、偏心、邊緣設計與眩光", "intro": "IOL 的光學設計要發揮作用，前提是在眼內的位置正確。偏心與傾斜會降低非球面 IOL 的成像品質，球差矯正越強的設計對位置越敏感。鏡片的 haptic 與單片式、三片式結構會影響囊袋內的穩定性；光學區邊緣設計則和術後眩光、暗影等 dysphotopsia 有關。", "terms": ["Decentration：IOL 光學中心偏離視軸", "Tilt：IOL 平面相對於視軸傾斜", "Dysphotopsia：術後出現的光暈、光條（positive）或顳側暗影（negative）"]}]}, {"id": "02", "en": "Biometry & Formula", "zh": "生物量測與計算", "subs": [{"id": "01", "en": "IOL Formulas & ELP", "zh": "公式比較、ELP、A-constant", "intro": "IOL 度數計算的核心，是預測鏡片在眼內的最終位置（ELP）。新一代公式（Barrett、Kane、EVO 等）在一般眼睛已相當準確；但在鞏膜固定、睫狀溝等非囊袋內的位置，ELP 會改變，常需要調整 A-constant 或度數。這個資料夾目前以鞏膜固定的度數計算研究為主。", "terms": ["ELP：有效鏡片位置，即 IOL 在眼內與角膜的實際距離", "PE（Prediction Error）：術後實際屈光與預測值的差", "A-constant：公式中代表鏡片位置特性的常數，可依臨床數據優化"]}, {"id": "02", "en": "Post-LASIK & Post-RK", "zh": "屈光手術後度數計算"}, {"id": "03", "en": "Toric Calculation", "zh": "Toric 計算、PCA、SIA", "intro": "Toric 度數計算除了前角膜 K 值，還要考慮後角膜散光（PCA）與手術誘發散光（SIA）。新一代 toric 公式與 Total Keratometry 已把這些因素納入，不同公式在大樣本中的準確度可以直接比較。閱讀 toric 研究的結果前，也建議先熟悉散光向量分析與標準化報告格式。", "terms": ["PCA：後角膜散光，多為逆規，會抵銷部分順規前角膜散光", "TK（Total Keratometry）：同時量測前、後角膜的總角膜屈光度", "向量分析：把散光的度數與軸向一起計算", "Double-angle plot：把散光軸角度加倍後作圖，用來呈現散光分佈"]}]}, {"id": "03", "en": "IOL Technology", "zh": "人工水晶體", "subs": [{"id": "01", "en": "Monofocal & Monofocal Plus", "zh": "單焦與增強型單焦"}, {"id": "02", "en": "EDOF & Trifocal", "zh": "延焦與多焦"}, {"id": "03", "en": "Toric & PAC", "zh": "Toric 設計、PAC、旋轉穩定性", "intro": "Toric IOL 用來矯正角膜散光，術後效果取決於三件事：度數計算、軸位對準與鏡片的旋轉穩定性。一般估計 toric 每偏離 1° 約損失 3% 的散光矯正效果，現代 toric IOL 術後平均旋轉約 2–3°。另一個較新的議題是角膜散光從中央到周邊並不一致，瞳孔放大時有效散光會變小，漸進式 toric（PAC）設計就是針對這一點。", "terms": ["WTR / ATR：順規 / 逆規散光，年紀越大越常轉為 ATR", "PAC（Progressive Axial Correction）：柱鏡度由光學區中央往周邊遞減的 toric 設計", "旋轉穩定性：術後 IOL 軸位與植入時軸位的差異，常以平均絕對旋轉與 5° 以內比例表示"]}, {"id": "04", "en": "IOL Materials", "zh": "材料、glistening、PCO", "intro": "IOL 材料主要分為疏水性壓克力、親水性壓克力與矽膠。材料會影響 glistening（鏡片內的微小水泡）、後囊混濁（PCO）的發生率、長期透明度，以及推注時的折疊與展開表現。疏水性壓克力搭配方銳邊設計，是目前降低 PCO 的主流做法。", "terms": ["Glistening：鏡片材料內形成的微小充水空泡，可能增加散射光", "PCO：後囊混濁，俗稱「次發性白內障」，需以 YAG 雷射處理", "Tg：玻璃轉化溫度，影響壓克力材料的柔軟度與展開速度"]}, {"id": "05", "en": "Delivery System & Injector", "zh": "推注器與預裝系統", "intro": "預裝式推注系統已成為主流，與手術效率、無菌操作和切口大小都有關係。這個主題的實驗研究關注三件事：不同推注器實際需要多大的切口、推注過程的阻力是否穩定，以及鏡片進入眼內後的展開速度（會受溫度影響）。", "terms": ["Preloaded IOL：出廠前已裝入推注器的 IOL，免去手術室裝載步驟", "Wound-assisted injection：推注器前端只抵住切口而不完全進入，可縮小所需切口"]}]}, {"id": "04", "en": "Complex Surgery", "zh": "複雜性手術", "subs": [{"id": "01", "en": "PCR & Vitreous Management", "zh": "後囊破裂與玻璃體處置", "intro": "後囊破裂（PCR）是白內障手術最常見的術中併發症之一。處置是否得當，會影響玻璃體脫出的程度、IOL 能放在哪裡，以及術後視力與視網膜併發症。了解破裂最常發生在哪個步驟，有助於預防與事先準備備案。", "terms": ["PCR：後囊破裂", "Anterior vitrectomy：前部玻璃體切除，用來清除脫出的玻璃體", "Backup IOL：囊袋無法使用時的備案鏡片，通常為三片式"]}, {"id": "02", "en": "Sulcus Fixation & Optic Capture", "zh": "睫狀溝植入與 optic capture", "intro": "後囊破裂但前囊仍完整時，睫狀溝植入是常見的備案。關鍵原則有三：睫狀溝應使用三片式 IOL，單片式壓克力 IOL 放在睫狀溝容易摩擦虹膜，引起色素播散、出血或眼壓上升；度數通常要比囊袋內略減；若前囊口完整，可做 optic capture 提升穩定性與置中。", "terms": ["Optic capture：把三片式 IOL 的光學區從前囊口下方推入、haptic 留在睫狀溝", "UGH syndrome：IOL 摩擦虹膜造成的葡萄膜炎、青光眼與前房出血"]}, {"id": "03", "en": "Yamane & Scleral Fixation", "zh": "Yamane 與鞏膜固定", "intro": "沒有囊袋支撐時，二次 IOL 的選項包括前房 IOL、虹膜固定 IOL，以及鞏膜固定（縫線或無縫線）。2017 年發表的 Yamane 雙針 flange 術式不需縫線、固定穩定，已成為主流做法。目前證據顯示它與縫線固定的長期結果相當、手術時間較短；研究重點已轉向 flange 製作、haptic 固定力、IOL 度數選擇與長期穩定性。", "terms": ["Flange：燒灼 haptic 末端形成的膨大結構，卡在鞏膜隧道中固定 IOL", "ISHF：鞏膜內 haptic 固定（intrascleral haptic fixation）", "30G 薄壁針：Yamane 術式用來穿刺鞏膜並引導 haptic 的針具"]}, {"id": "04", "en": "IOL Subluxation & Exchange", "zh": "IOL 脫位與置換", "intro": "IOL 或水晶體半脫位、脫位多與懸韌帶無力有關，例如假性脫皮症候群、高度近視、外傷或曾接受玻璃體手術，可能在白內障手術多年後才發生。處置方式依脫位程度與位置而定：重新固定原 IOL，或取出後改用鞏膜固定、虹膜固定 IOL；後脫位通常需要與玻璃體視網膜科合作。", "terms": ["Zonular weakness：懸韌帶無力", "PXF：假性脫皮症候群，晚期 IOL 脫位的常見危險因子", "In-the-bag dislocation：IOL 連同囊袋一起脫位"]}]}, {"id": "05", "en": "Others · Society Articles", "zh": "其他資料（醫學會文章）", "subs": [{"id": "01", "en": "Society & Magazine Articles", "zh": "醫學會刊物與專業雜誌文章（EyeNet、EyeWorld、CRST）", "intro": "這裡收錄醫學會刊物與專業雜誌的文章，例如 AAO EyeNet、EyeWorld 與 CRST。這類文章多為專家經驗分享、技術要點或會議重點整理，未經正式期刊同儕審查；引用時請與正式發表的期刊論文分開看待。", "terms": []}, {"id": "02", "en": "Congress Abstracts & Posters", "zh": "年會口頭報告摘要與海報（ESCRS 等）", "intro": "這裡收錄醫學會年會的口頭報告摘要與海報，例如 ESCRS。內容多為初步結果，篇幅有限、細節較少，部分研究之後才會以正式論文發表；引用時請優先查找是否已有對應的期刊版本。", "terms": []}]}], "papers": [{"id": "p3c56098a", "cat": "01", "sub": "01", "year": 2015, "title": "Distribution of corneal and ocular spherical aberrations in eyes with cataract in the Taiwanese population", "titleZh": "台灣白內障患者的角膜與全眼球差分佈", "doi": "10.1016/j.tjo.2015.03.003", "mustRead": true, "mustRank": 1}, {"id": "p2254d58e", "cat": "01", "sub": "02", "year": 2022, "title": "Dysphotopsias or Unwanted Visual Phenomena after Cataract Surgery", "titleZh": "白內障術後眩光與異常視覺現象（dysphotopsia）綜述", "doi": "10.3390/life13010053", "mustRead": true, "mustRank": 3}, {"id": "pb474fcec", "cat": "01", "sub": "02", "year": 2015, "title": "Capsular bag performance of a hydrophobic acrylic 1-piece intraocular lens", "titleZh": "疏水性壓克力單片式 IOL 的囊袋內表現：與三片式比較", "doi": "10.1016/j.jcrs.2014.04.030"}, {"id": "pe9a6e8ab", "cat": "01", "sub": "02", "year": 2016, "title": "Comparisons of the in-the-bag stabilities of single-piece and three-piece intraocular lenses for age-related cataract patients: a randomized controlled trial", "titleZh": "單片式 vs 三片式 IOL 的囊袋內穩定性：隨機對照試驗", "doi": "10.1186/s12886-016-0283-4", "mustRead": true, "mustRank": 2}, {"id": "p313a1f93", "cat": "01", "sub": "02", "year": 2014, "title": "Evaluation of actual retinal images produced by misaligned aspheric intraocular lenses in a model eye", "titleZh": "非球面 IOL 偏 ic intraocular lenses by lens model and haptic design: systematic review and single-arm meta-analysis", "authors": "Li ES, Vanderford EK, Xu Y, Kang PC", "journal": "Journal of Cataract & Refractive Surgery", "citation": "J Cataract Refract Surg. 2024;50:976–984", "doi": "10.1097/j.jcrs.0000000000001486", "tags": ["Toric", "旋轉穩定性", "Haptic 設計", "Meta-analysis"], "titleZh": "Toric IOL 旋轉穩定性：依鏡片型號與 haptic 設計的統合分析", "mustRead": true, "url": "", "mustRank": 1}, {"id": "pc220fea5", "cat": "03", "sub": "03", "year": 2025, "title": "Study on Factors Affecting Toric Intraocular Lens Rotation Using Intraoperative OCT—Factors Influencing IOL Deployment and Proximity to Posterior Capsule After Insertion", "titleZh": "影響 toric IOL 旋轉的因素：術中 OCT 觀察鏡片展開與後囊貼合", "doi": "10.3390/jcm14186599"}, {"id": "pb5f8e384", "cat": "03", "sub": "04", "year": 2021, "title": "In-vitro glistening formation in six different foldable hydrophobic intraocular lenses", "titleZh": "6 款疏水性可折疊 IOL 的體外 glistening 比較", "doi": "10.1186/s12886-021-01879-6", "mustRead": true, "mustRank": 3}, {"id": "p0ac29666", "cat": "03", "sub": "04", "year": 2024, "title": "Innovative Polymeric Biomaterials for Intraocular Lenses in Cataract Surgery", "titleZh": "IOL 創新高分子材料綜述", "doi": "10.3390/jfb15120391"}, {"id": "p55c41cad", "cat": "03", "sub": "04", "year": 2025, "title": "How do intraocular lens materials influence the outcome of cataract surgery?", "titleZh": "IOL 材料如何影響白內障手術結果：綜述", "doi": "10.1097/ICU.0000000000001095", "mustRead": true, "mustRank": 1}, {"id": "p177b1cba", "cat": "03", "sub": "04", "year": 2026, "title": "The influence of different types of intraocular lenses on the development of posterior capsular opacification: a systematic review", "titleZh": "不同 IOL 類型對後囊混濁（PCO）的影響：系統性回顧", "mustRead": true, "mustRank": 2}, {"id": "p3b5b3f29", "cat": "03", "sub": "04", "year": 2012, "title": "Simulation of 20-year Deterioration of Acrylic IOLs Using Severe Accelerated Deterioration Tests", "titleZh": "壓克力 IOL 20 年老化的加速劣化模擬"}, {"id": "p1e00cf7c", "cat": "03", "sub": "05", "year": 2023, "title": "Experimental analysis of recommended corneal incision sizes in cataract surgery using 13 intraocular lens injector systems", "titleZh": "13 種 IOL 推注系統的建議切口大小實驗分析", "doi": "10.1038/s41598-023-29497-w", "mustRead": true, "mustRank": 1}, {"id": "p0619fa48", "cat": "03", "sub": "05", "year": 2026, "title": "Variation in resistance force during intraocular lenses injection by modern injectors and assessment of damage to the injector: a laboratory analysis", "titleZh": "現代推注器的推注阻力變化與推注器損傷：實驗室分析", "doi": "10.1038/s41598-026-41145-7"}, {"id": "pc1afb847", "cat": "03", "sub": "05", "year": 2023, "title": "Intraocular Lens Unfurling Time Exponentially Decays with Increased Solution Temperature", "titleZh": "溶液溫度越高，IOL 展開時間越短", "doi": "10.2147/OPTH.S417357"}, {"id": "p7fed5eba", "cat": "04", "sub": "01", "year": 2025, "title": "Clinical features, management, and outcomes of posterior capsule rupture during phacoemulsification surgery", "authors": "Koser E, Kemer Atik B, Emul M, Ahmet S, Kandemir Besek N, Cubuk MO, Kirgiz A", "journal": "Arquivos Brasileiros de Oftalmologia", "citation": "Arq Bras Oftalmol. 2025;88(5):e2024-0328", "doi": "10.5935/0004-2749.2024-0328", "studyType": "回溯性觀察世代研究（單一中心）", "n": "25,224 例手術中 351 眼發生 PCR", "tags": ["PCR", "玻璃體脫出", "危險因子", "睫狀溝植入", "鞏膜固定"], "conclusion": "單一中心 25,224 例超音波乳化術的 PCR 發生率為 1.3%；經適當處置，一年後 79.4% 的眼睛 BCVA 達 0.30 logMAR 或更好。", "about": "土耳其一家三級眼科醫院回溯 2017–2022 年 25,224 例超音波乳化術，納入發生 PCR (定義為術中後囊撕裂合併玻璃體脫出) 且追蹤滿一年的 351 眼，分析術前危險因子、PCR 發生的手術階段、IOL 植入位置，以及術後一年內的併發症與視力。所有 PCR 眼都接受前段玻璃體切除；囊袋無法支撐時，睫狀溝可支撐就植入三片式 IOL，否則改用鞏膜固定。", "keyResults": ["PCR 發生率 1.3% (351/25,224)；住院醫師 1.6%、主治醫師 1.2% (p = 0.006)", "術前危險因子：假性脫皮 (PEX) PCR 率 3.2%、褐色白內障 3.4%、成熟白內障 2.8%", "PCR 最常發生在乳化階段 (63%)，其次為 I&A (23.4%)；發生階段與一年 BCVA、早晚期併發症都沒有顯著相關", "同次手術植入 IOL 73.2%：睫狀溝 56.1%、囊袋 10.3%、鞏膜固定 6.8%；26.8% 暫時維持無水晶體，平均 2.77 個月後二次植入 (Z suture 鞏膜固定 54 眼、Yamane 17 眼、睫狀溝 15 眼）", "術中併發症：水晶體碎片掉入玻璃體 8% (其中 9 眼需玻璃體切除) 、虹膜損傷 7.1%", "早期併發症：角膜水腫 55.6%、眼壓升高 33.3%；晚期併發症：持續眼壓升高 11.1%、CME 5.1%、視網膜剝離 2.5%、IOL 脫位 1.4%", "BCVA (logMAR) 由術前 1.31 改善至一年 0.51 (p < 0.001)；79.4% (279/351) 達 0.30 或更好"], "clinical": "術前可以 PEX、成熟或褐色白內障等因素辨識 PCR 風險較高的病例。這篇的數據也可作為術前說明的參考範圍：即使發生 PCR，多數患者一年後仍能恢復可用視力，但 CME 與視網膜剝離需要較長期追蹤。此為單一中心結果，各院的發生率與預後可能不同。", "limitations": ["回溯性、無對照組（未發生 PCR 的病例術後一個月即轉出，缺少長期資料）", "單一轉診中心，主治醫師負責較困難的病例，住院醫師與主治醫師的 PCR 率比較可能受影響", "術者經驗只分兩級，無法依年資或手術量細分"], "authorsView": "作者認為 PCR 是超音波乳化術無法完全避免的併發症，發生率會隨術者經驗增加而下降；PEX 等高風險族群需要更加小心。發生 PCR 的患者應以跨科方式長期追蹤 CME、視網膜剝離與眼壓等問題，並預期可能需要二次手術；只要處置得當，仍能獲得令人滿意的視力與解剖結果。", "figures": [{"kind": "line", "title": "PCR 患者的 BCVA 變化（logMAR，數值越低越好）", "labels": ["術前", "術後 1 天", "1 週", "1 個月", "3 個月", "6 個月", "1 年"], "series": [{"name": "平均 BCVA", "values": [1.31, 1.57, 0.88, 0.76, 0.62, 0.6, 0.51]}], "unit": "", "lowerBetter": true, "caption": "術後第 1 天視力最差，之後逐步改善；除第 1 天外，各時間點都顯著優於術前（p < 0.001）。", "source": "依原文 Figure 1 與 Results 數據重繪（Koser et al., Arq Bras Oftalmol 2025，CC BY 4.0）", "decimals": 2}, {"kind": "bar", "title": "不同族群的 PCR 發生率", "labels": ["全部病例", "假性脫皮（PEX）", "褐色白內障", "成熟白內障", "住院醫師執刀", "主治醫師執刀"], "series": [{"name": "PCR 發生率", "values": [1.3, 3.2, 3.4, 2.8, 1.6, 1.2]}], "unit": "%", "caption": "假性脫皮（PEX）、褐色與成熟白內障的 PCR 發生率都高於整體的 1.3%；住院醫師執刀的 PCR 率顯著高於主治醫師（p = 0.006）。", "source": "依原文 Results 數據重繪（Koser et al., Arq Bras Oftalmol 2025，CC BY 4.0）"}, {"kind": "table", "title": "PCR 發生的手術階段與一年視力", "columns": ["手術階段", "眼數（%）", "一年 BCVA（logMAR）"], "rows": [["Capsulorhexis", "13（3.7%）", "0.67 ± 0.88"], ["Sculpting", "6（1.7%）", "0.95 ± 0.76"], ["Phacoemulsification", "221（63%）", "0.39 ± 0.46"], ["Irrigation & aspiration", "82（23.4%）", "0.43 ± 0.58"], ["IOL 植入與 OVD 移除", "29（8.2%）", "0.38 ± 0.60"]], "caption": "較早階段發生 PCR 的眼睛，一年視力數值上較差，但差異未達統計顯著（p = 0.67）。", "source": "整理自原文 Table 2（Koser et al., Arq Bras Oftalmol 2025，CC BY 4.0）"}], "titleZh": "超音波乳化術中後囊破裂 (PCR) 的臨床特徵、處置與結果", "mustRead": true, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T02:34:13.140Z", "mustRank": 1}, {"id": "pe7f0b458", "cat": "04", "sub": "01", "year": 2025, "title": "Timing of posterior capsular rupture during cataract surgery", "authors": "Narayan A, Neo YN, Lockington D, Day AC", "journal": "Eye", "citation": "Eye. 2025;39:2708–2712", "doi": "10.1038/s41433-025-03942-8", "studyType": "回溯性觀察研究（單一中心，連續病例）", "n": "1,042 眼（皆為 PCR 病例）", "tags": ["PCR", "手術階段", "前囊撕裂", "睫狀溝", "Optic capture"], "conclusion": "PCR 最常發生在乳化階段 (60%)，其次是 I/A (24%)；合併前囊撕裂時，PCR 較常發生在較早的階段，IOL 植入位置也明顯不同。", "about": "英國 Moorfields 眼科醫院回溯 2014–2018 年所有併發 PCR 的白內障手術，共 1,042 眼 (排除合併角膜、青光眼手術或 phacovitrectomy，以及未清楚記錄 PCR 發生階段的病例)。研究把手術分成六個階段：水分離、乳化、I/A、IOL 植入、移除黏彈劑、傷口水合；主要分析 PCR 發生在哪個階段，次要分析前囊撕裂、其他術中併發症與 IOL 植入位置。乳化使用 Alcon Infiniti 或 Centurion，多數病例以雙手式金屬 I/A 頭吸除皮質。", "keyResults": ["PCR 發生階段：乳化 621 眼 (60%)、I/A 248 眼 (24%)、IOL 植入 87 眼 (8%)、移除黏彈劑 44 眼 (4%)、水分離 40 眼 (3%)、傷口水合 2 眼", "合併的術中併發症：玻璃體脫出 80%、前囊撕裂 15%、核或碎片掉入玻璃體 12%、懸韌帶斷裂 5%", "IOL 植入位置：睫狀溝 60%、睫狀溝加 optic capture 19%、囊袋 11%、前房 IOL 2%、維持無水晶體 8%", "有前囊撕裂與前囊完整相比：PCR 發生在水分離或乳化階段的比例為 80% 與 61%；兩組的 PCR 發生階段與 IOL 植入位置分布都有顯著差異（p < 0.01），年齡與性別無差異", "有前囊撕裂者：optic capture 3.9% (vs. 前囊完整 20.7%)、維持無水晶體 19.4% (6.4%)、植入囊袋 4.5% (12.4%）", "最常使用的 IOL 為三片式 MA60AC (79%），其次為單片式 SN60WF (10%）"], "clinical": "乳化與 I/A 合計約占 PCR 的八成，可作為手術訓練與術中風險提醒的重點階段。術中發現前囊撕裂時，後續步驟需留意破裂延伸，並預期 optic capture 的機會較低，可提前準備睫狀溝、前房或鞏膜固定的備案。此為單一中心回溯資料，且沒有 PCR 發生率，不能用來比較不同術式或器械的風險。", "limitations": ["回溯性、單一中心，資料來自電子病歷關鍵字搜尋；只納入 PCR 病例，無法得知 PCR 發生率", "手術階段分類較粗，例如乳化階段沒有細分刻槽、劈核與移除核碎片", "I/A 方式混合雙手式、自動與 Simcoe，器械無法統一", "未分析術者等級、白內障分級與懸韌帶狀況等術前因素"], "authorsView": "作者認為 PCR 最可能發生在乳化階段，與過去文獻一致。早期研究多報告 I/A 階段最常見，作者推測雙手式 I/A 等器械進步可能降低了這個階段的風險，矽膠 I/A 頭也有助於進一步降低風險。作者也認為前囊撕裂會使 PCR 傾向發生在水分離與乳化等較早階段，並影響 IOL 植入位置：前囊與後囊都有破損時，支撐可能不足，因此較多醫師選擇維持無水晶體或植入前房 IOL。\n\n作者另指出，多數後囊破口邊緣看不清楚，發生 PCR 時睫狀溝植入可能比囊袋植入更合適；optic capture 的優點是穩定度較好，且不需調整度數。", "figures": [{"kind": "bar", "title": "PCR 發生在手術的哪個階段（1,042 眼）", "labels": ["水分離", "乳化", "I/A", "IOL 植入", "移除黏彈劑", "傷口水合"], "series": [{"name": "比例", "values": [3.8, 59.6, 23.8, 8.3, 4.2, 0.2]}], "unit": "%", "max": 100, "caption": "乳化與 I/A 合計約占 83%。", "source": "依原文 Table 3 與 Results 數據重繪（Narayan et al., Eye 2025，CC BY 4.0）", "decimals": 1}, {"kind": "bar", "title": "PCR 發生階段：有前囊撕裂 vs 前囊完整", "labels": ["水分離", "乳化", "I/A", "IOL 植入", "移除黏彈劑", "傷口水合"], "series": [{"name": "有前囊撕裂（155 眼）", "values": [8.4, 71.0, 16.1, 3.2, 1.3, 0]}, {"name": "前囊完整（887 眼）", "values": [3.0, 57.5, 25.3, 9.2, 4.7, 0.2]}], "unit": "%", "max": 100, "caption": "有前囊撕裂時，PCR 較集中在水分離與乳化等較早階段（p < 0.01）。", "source": "依原文 Table 4 數據重繪（Narayan et al., Eye 2025，CC BY 4.0）", "decimals": 1}, {"kind": "bar", "title": "IOL 植入位置：有前囊撕裂 vs 前囊完整", "labels": ["睫狀溝", "睫狀溝＋optic capture", "囊袋", "前房 IOL", "維持無水晶體"], "series": [{"name": "有前囊撕裂（155 眼）", "values": [68.4, 3.9, 4.5, 3.9, 19.4]}, {"name": "前囊完整（887 眼）", "values": [58.4, 20.7, 12.4, 2.0, 6.4]}], "unit": "%", "max": 100, "caption": "有前囊撕裂時，optic capture 與囊袋植入明顯較少，維持無水晶體的比例較高（p < 0.01）。", "source": "依原文 Table 4 數據重繪（Narayan et al., Eye 2025，CC BY 4.0）", "decimals": 1}], "titleZh": "白內障手術中後囊破裂發生的時間點", "mustRead": false, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T03:24:05.858Z", "liveFigures": [{"addedAt": "2026-11-11T03:13:30.772Z", "alt": "術中併發症與IOL置放位置", "assetId": "76c14ec33611b7c0d0241dbca20bf940", "caption": "底色標示為本站加註", "editedAt": "2026-11-11T03:23:42.153Z", "kind": "image", "source": "原文 Table 2（Narayan A et al., Eye. 2025;39:2708–2712）", "title": "術中併發症與IOL置放位置"}], "liveOrder": ["b0", "2026-11-11T03:13:30.772Z", "b1", "b2"]}, {"id": "p283d217e", "cat": "04", "sub": "02", "year": 2026, "title": "Advances and Challenges in Sulcus-Implanted Intraocular Lenses: A Comprehensive Narrative Review", "authors": "Romano MR, Savastano A, Keegan D, Toro MD, Vidal-Aroca F, Di Simplicio S, Stanzel B, Fasolino G, Cabrera F, Rizzo S", "journal": "Ophthalmology and Therapy", "citation": "Ophthalmol Ther. 2026;15:1205–1232", "doi": "10.1007/s40123-026-01331-2", "studyType": "敘述性回顧 (Narrative review)", "n": "50 篇研究", "tags": ["睫狀溝", "三片式 IOL", "附加型 IOL", "次發性 IOL", "併發症"], "conclusion": "睫狀溝植入的效果與安全性高度取決於 IOL 設計：三片式與專為睫狀溝設計的附加型IOL表現最好，單片式壓克力 IOL 的併發症風險較高。", "about": "以 PubMed 檢索加上人工追查參考文獻，納入 50 篇報告睫狀溝 IOL 臨床結果的研究，涵蓋三片式鏡片、附加型(supplementary / add-on) 鏡片，以及放在睫狀溝的一般 IOL；適應症包括無水晶體、懸韌帶無力、IOL 脫位、後囊破裂與屈光補強。數值依各研究原始報告呈現，沒有做標準化合併或統計比較。", "keyResults": ["病例選擇適當時，術後視力多改善 0.10–0.30 logMAR，許多研究報告 20/40 或更好", "三片式 IOL：CME 1–8%、色素播散 0–12%、眼壓升高 1–9%", "單片式壓克力 IOL：虹膜摩擦、色素播散、眼壓升高與 UGH 症候群的風險持續較高", "專為睫狀溝設計的附加型鏡片：置中良好、傾斜與偏位低，且可取出", "50 篇中報告各類併發症的研究數：CME 8 篇、視網膜剝離 8 篇、色素播散 5 篇、角膜水腫 4 篇、虹膜摩擦 1 篇、UGH 症候群 1 篇", "一項兒童研究：睫狀溝固定眼的續發性青光眼 28.57%，囊袋固定眼 10.53%（p = 0.007）"], "clinical": "這篇整理了睫狀溝 IOL 的整體證據，與 2009 年 ASCRS 報告的結論一致：單片式壓克力 IOL 不適合放在睫狀溝。由於是敘述性回顧、資料異質性高，文中的百分比較適合當作範圍參考，不宜直接用來比較不同鏡片或技術的優劣。", "limitations": ["敘述性回顧，未依 PRISMA 系統性方法，沒有統合分析或偏差風險評估", "納入研究多為回溯性病例系列，適應症、併發症定義與追蹤時間差異大", "多款附加型鏡片上市時間較短，長期資料有限"], "authorsView": "作者認為睫狀溝植入應視為一系列技術，而非單一手術；鏡片設計、固定方式與病人選擇配合得當時，睫狀溝 IOL 能帶來有意義的視力恢復。作者指出證據不支持把單片式壓克力 IOL 放在睫狀溝；三片式壓克力、矽膠或單片 PMMA 仍是無囊袋支撐時的主要選項。對有殘餘屈光誤差或老花需求的人工水晶體眼，專為睫狀溝設計的附加型鏡片在部分病人可能優於換片或角膜手術。作者呼籲從臨時性的仿單外使用，轉向更標準化的睫狀溝專用平台，並向病人充分說明可逆性與長期的不確定性。", "figures": [{"kind": "bar", "title": "50 篇研究中，報告各類術後併發症的研究篇數", "labels": ["CME", "視網膜剝離", "色素播散", "角膜水腫", "虹膜摩擦", "UGH 症候群"], "series": [{"name": "研究篇數", "values": [8, 8, 5, 4, 1, 1]}], "unit": " 篇", "caption": "這是「有報告該併發症的研究數」，不是發生率，也不能用來比較不同鏡片或技術。", "source": "依原文 Table 3 與 Fig. 2 數據重繪（Romano et al., Ophthalmol Ther 2026，CC BY-NC 4.0）"}], "titleZh": "睫狀溝植入 IOL 的進展與挑戰：全面敘述性回顧", "mustRead": true, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T06:01:30.300Z", "mustRank": 2}, {"id": "p0ebc5bd0", "cat": "04", "sub": "02", "year": 2022, "title": "Three-piece intraocular lens in the sulcus with optic capture in patients with mild to moderate zonular weakness in exfoliation", "authors": "Bhaskaran J, Narayanan S, Balamurali R", "journal": "Indian Journal of Ophthalmology", "citation": "Indian J Ophthalmol. 2022;70:4312–4318", "doi": "10.4103/ijo.IJO_1415_22", "studyType": "回溯性病例系列 (單一中心、單一醫師）", "n": "35 眼 (33 眼完成追蹤）", "tags": ["假性脫皮", "懸韌帶無力", "睫狀溝", "Optic capture", "三片式 IOL"], "conclusion": "假性脫皮合併輕到中度懸韌帶無力的患者，把三片式 IOL 放在睫狀溝並將光學區嵌入前囊口 (Optic capture），平均追蹤 2 年 3 個月沒有發生 IOL 晚期脫位。", "about": "印度單一中心回溯 2017–2022 年 35 位假性脫屑 (exfoliation) 患者，皆有直接或間接的懸韌帶無力證據 (例如水晶體晃動、小瞳孔、褐色核、前房淺）。由同一位醫師以 5–5.25 mm 前囊造口完成乳化後，把三片式疏水性壓克力 IOL 的 haptic 放在睫狀溝，再把光學區推入前囊口後方形成 optic capture；度數與囊袋內 IOL 相同。17 眼使用囊袋張力環(CTR），15 眼使用虹膜勾擴瞳。", "keyResults": ["35 眼中 2 眼失聯，33 眼納入分析；平均年齡 75.2 歲，平均追蹤 2 年 3 個月（4 個月至 5 年）", "CDVA (logMAR) 由術前 1.40 ± 0.92 改善至術後 1 個月 0.38 ± 0.26", "眼壓由術前 15.27 ± 3.89 mmHg 變為術後 1 個月 13.54 ± 4.21 mmHg", "追蹤期間無 IOL 晚期半脫位或脫位，也沒有 PCO、前囊口收縮、明顯色素播散或葡萄膜炎", "術後第 1 天 5 眼出現 Descemet 膜皺褶，皆以保守治療改善；無前囊袋膨脹症候群（capsular distension syndrome）"], "clinical": "對假性脫屑合併輕到中度懸韌帶無力的病例，「三片式 IOL 睫狀溝＋optic capture」是一個不需額外固定裝置的選項，可作為和囊袋張力環、鞏膜固定等方式比較時的參考。此為單一醫師的小型病例系列、沒有對照組，長期防止脫位的效果仍需更多研究確認。", "limitations": ["回溯性、無對照組，樣本小", "單一醫師執行，結果不一定能推廣到其他術者", "術後視力只報告 1 個月的數據，追蹤時間長短不一（部分僅 4 個月）"], "authorsView": "作者認為，haptic 放在睫狀溝提供主要支撐，可減少對已經無力的懸韌帶的依賴；optic capture 則讓 IOL 置中、避免光學區與虹膜接觸，也能防止瞳孔阻滯，度數可沿用囊袋內 IOL 的計算。作者建議：輕到中度懸韌帶無力時，這是理想的做法；嚴重懸韌帶病變則需加上虹膜縫合、鞏膜固定或 Cionni ring 等固定方式；沒有明顯懸韌帶病變、年紀相對較輕（50–60 多歲）的假性脫屑患者，也可考慮此法以預防日後囊袋內 IOL 脫位。", "titleZh": "假性脫皮症候群懸韌帶輕中度無力：三片式 IOL 睫狀溝植入合併 optic capture", "mustRead": false, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T06:11:14.449Z", "liveFigures": [{"addedAt": "2026-11-11T06:10:56.788Z", "alt": "3-Piece IOL 採用Optical capture方法", "assetId": "4e27ba6a806c5d06a33c333b75d40e4a", "caption": "", "fid": "fmwbq0as4", "kind": "image", "source": "原文 Figure 3（Bhaskaran J et al., Indian J Ophthalmol. 2022;70:4312–4318）", "title": "3-Piece IOL 採用Optical capture方法"}], "liveOrder": ["fmwbq0as4"]}, {"id": "pf2d93b2d", "cat": "04", "sub": "02", "year": 2009, "title": "Complications of sulcus placement of single-piece acrylic intraocular lenses: Recommendations for backup IOL implantation following posterior capsule rupture", "authors": "Chang DF, Masket S, Miller KM, Braga-Mele R, Little BC, Mamalis N, Oetting TA, Packer M; ASCRS Cataract Clinical Committee", "journal": "Journal of Cataract & Refractive Surgery", "citation": "J Cataract Refract Surg. 2009;35:1445–1458", "doi": "10.1016/j.jcrs.2009.04.027", "studyType": "專題報告（回溯性病例系列＋文獻回顧）", "n": "30 位患者（30 眼）", "tags": ["睫狀溝", "單片式壓克力 IOL", "UGH 症候群", "備用 IOL", "ASCRS"], "conclusion": "設計為囊袋中使用的 IOL (如單片式壓克力 IOL) 不應放在睫狀溝；每台白內障手術都應備有合適度數、尺寸與設計的備用 IOL。", "about": "ASCRS 白內障臨床委員會 6 位成員回顧 2006–2008 年轉診到其診所、因單片式壓克力 (SPA) IOL 放在睫狀溝而出現併發症的 30 位患者，記錄臨床表現與處置結果，並回顧文獻，整理後囊破裂時備用 IOL 的設計、尺寸與度數建議。這些都是轉診個案，作者本身不在睫狀溝植入 SPA IOL。", "keyResults": ["30 眼中 29 眼為 AcrySof 單片式 IOL，1眼為 Rayner 570C", "併發症 (30 位）：色素播散 25、虹膜透照缺損 24、IOL 邊緣症狀 13、眼壓 > 22 mmHg 10、眼內出血 7、CME 4", "多數患者同時有多種併發症：1 種 2 位、2 種 8 位、3 種 13 位、4 種 4 位、5 種 2 位", "28 眼 (93%) 需要手術處置，其中 25 眼 (83%) 更換 IOL；處置後 17 眼 CDVA 達 20/20", "作者的睫狀溝 IOL 建議：選三片式、haptic 向後傾斜、光學區前緣圓滑；沒有光學區夾持時，選最長的三片式摺疊 IOL，光學區至少 6.0 mm，不建議總長短於 13.0 mm", "度數建議：以 capsulorhexis 夾持光學區時 (Optical Capture)，通常可沿用囊袋計算的度數；整顆 IOL 放在睫狀溝時，度數降低 0.5–1.0 D", "2008 年 AAO 年會現場投票「SPA IOL 能否放睫狀溝」：永遠不行 47%、囊袋支撐足夠時可以 40%、沒有其他 IOL 時可以 11%、縫合固定時可以 2%"], "clinical": "「單片式壓克力 IOL 不放睫狀溝」至今仍是普遍採用的原則，2026 年的睫狀溝敘述性回顧也以這篇作為共識依據。手術室可準備三片式備用 IOL，並參考原文的度數調整原則。各款 IOL 的總長與設計規格不同，選用時仍應以仿單為準。", "limitations": ["轉診病例系列，無法得知睫狀溝植入 SPA IOL 後實際發生併發症的比例", "回溯性資料，CME 可能低報", "未評估三片式 IOL 放在睫狀溝的併發症", "2009 年發表，文中提到的部分 IOL 型號與固定技術已有更新"], "authorsView": "作者認為這些併發症與 SPA IOL 的設計直接相關：haptic 厚而平、不向後傾斜，總長約 13.0 mm，對較大的眼睛太短；表面較黏、光學區邊緣方正，放在睫狀溝容易摩擦虹膜並偏位，引起色素播散、UGH 症候群與慢性發炎。作者建議只設計給囊袋的 IOL 不應放在睫狀溝；後囊破裂時，以三片式 IOL 搭配 Optical Capture 最理想。作者也呼籲每台手術都備妥合適的備用 IOL，並期待業界開發專為無囊袋支撐眼設計的 IOL。", "figures": [{"kind": "bar", "title": "SPA IOL 放在睫狀溝後的併發症（30 位患者）", "labels": ["色素播散", "虹膜透照缺損", "IOL 邊緣症狀", "眼壓 > 22 mmHg", "眼內出血", "CME"], "series": [{"name": "患者數", "values": [25, 24, 13, 10, 7, 4]}], "unit": " 位", "max": 30, "caption": "多數 <script>
const DATA = JSON.parse(document.getElementById("catalog").textContent);
const app = document.getElementById("app");
const heroEl = document.getElementById("hero");
const q2 = document.getElementById("q2");

const state = { review: {}, unlocking: null, figs: {}, addingFig: null, figEdit: null, assets: null, sub: null, onlyDone: false, onlyReviewed: false, onlyUnreviewed: false, query: "", editing: null, editingIntro: null, overrides: {}, intros: {}, priv: {}, isOwner: false, db: null };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const catById = id => DATA.categories.find(c => c.id === id);
const subOf = p => catById(p.cat).subs.find(s => s.id === p.sub);
const view = p => {
  const v = state.overrides[p.id] ? { ...p, ...state.overrides[p.id], edited: true } : { ...p };
  const r = state.review[p.id];
  // Signed-in viewers read the live review state; everyone else sees the state baked in at the last sync.
  if (state.reviewLoaded) { v.reviewed = Boolean(r?.reviewed); v.locked = Boolean(r?.locked); }
  else { v.reviewed = Boolean(p.reviewed); v.locked = Boolean(p.locked); }
  return v;
};
const all = () => DATA.papers.map(view);
const has = p => Boolean(p.conclusion && p.conclusion.trim());
const inCat = (cat, sub) => all().filter(p => p.cat === cat && (!sub || p.sub === sub));
const byYear = (a, b) => (b.year || 0) - (a.year || 0) || a.title.localeCompare(b.title);
const rank = p => p.mustRead ? (p.mustRank || 99) : 999;
const byMust = (a, b) => rank(a) - rank(b) || byYear(a, b);
// Category lists: must-read first, then author-reviewed, then the rest by year.
const byList = (a, b) => rank(a) - rank(b) || (b.reviewed - a.reviewed) || byYear(a, b);
const introOf = (c, s) => { const o = state.intros[`${c.id}-${s.id}`]; return o ? { intro: o.intro, terms: o.terms || [], edited: true } : { intro: s.intro || "", terms: s.terms || [] }; };
const MUST = '<span class="chip must">必讀</span>';

function item(p) {
  const s = subOf(p);
  const tags = `<div class="tags">${p.mustRead ? MUST : ""}<span class="chip year">${p.year ?? "—"}</span>${p.studyType ? `<span class="chip">${esc(p.studyType)}</span>` : ""}<span>${esc(s.en)}</span>${has(p) ? (p.reviewed ? '<span class="chip ok">經作者校閱</span>' : "") : '<span class="chip wip">摘要整理中</span>'}${state.priv[p.id] ? `<span class="chip" title="檔案標籤（只有你看得到）">${esc(state.priv[p.id].label)}</span>` : ""}</div>`;
  return `<a class="item" href="#${p.id}">${tags}<div class="lead">${esc(p.titleZh || p.title)}</div>${has(p) ? `<div class="takeaway"><b>重點</b>${esc(p.conclusion)}</div>` : ""}<div class="en">${esc(p.title)}</div></a>`;
}

function hero(on) {
  document.getElementById("miniSearch").hidden = on;
  if (!on) { heroEl.innerHTML = ""; return; }
  const list = all();
  heroEl.innerHTML = `<section class="hero"><div class="wrap">
    <h1>白內障與人工水晶體 - 文獻學習資料庫</h1>
    <p>為眼科與產業專業人士整理：依${['零','一','二','三','四','五','六','七','八','九','十'][DATA.categories.length] || DATA.categories.length}大主題分類<span class="hero-live">網站持續更新中</span></p>
    <p class="ai-note">中文摘要由 AI 工具輔助生成，Posen Wang 負責文獻蒐集、統整與分類，為產業人士節省查找與閱讀時間。</p>
    <div class="hero-search"><input id="q" type="search" placeholder="輸入關鍵字，例如 Yamane、toric 旋轉、glistening" aria-label="搜尋文獻" value="${esc(state.query)}"></div>
    <div class="hero-stats"><span><b>${list.length}</b>篇文獻</span><span><b>${list.filter(has).length}</b>篇已有中文摘要</span><span><b>${DATA.categories.length}</b>大主題</span></div>
  </div></section>`;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.query = q.value; if (q.value.trim()) { location.hash = "#search"; } });
}

function home() {
  hero(true);
  app.innerHTML = `
    <section style="display:grid;gap:14px">
      <div class="sec-head"><h2>依主題瀏覽</h2><span>${['零','一','二','三','四','五','六','七','八','九','十'][DATA.categories.length] || DATA.categories.length}大知識分類</span></div>
      <div class="topics">${DATA.categories.map(c => {
        const list = inCat(c.id), n = list.filter(has).length;
        return `<a class="topic" href="#c${c.id}">
          <div class="topic-head"><h3>${esc(c.zh)}<small>${c.id} · ${esc(c.en)}</small></h3><span class="count">${list.length} 篇</span></div>
          <ul>${c.subs.map(s => { const k = inCat(c.id, s.id).length; return `<li class="${k ? "" : "zero"}"><span>${esc(s.en)}</span><span>${k}</span></li>`; }).join("")}</ul>
          ${n ? `<span style="font-size:13px;color:var(--accent)">${n} 篇已有中文摘要</span>` : ""}
        </a>`;
      }).join("")}</div>
    </section>`;
}


// ---- Share links: one site, deep links to a topic (#c04), a subtopic (#c04-03) or a paper (#p…) ----
// The same page builds two sites: the Claude editing site and the public read-only site (build_reader.py sets READER).
const READER = true;
const READER_URL = "https://posen-cataract.github.io/cataract-iol-insight/";
const SITE_URL = READER ? READER_URL : "https://claude.ai/artifact/82a8AZAc6mBKCchJnBfvqQ";
const setHash = h => { try { history.replaceState(null, "", "#" + h); } catch {} };
const shareBtn = (label, hash) => `<span class="share"><button class="btn share-btn" type="button" data-share="${esc(hash)}">${label}</button><span class="share-out" role="status"></span></span>`;
function wireShare() {
  app.querySelectorAll("[data-share]").forEach(b => b.addEventListener("click", async () => {
    const url = SITE_URL + "#" + b.dataset.share, out = b.nextElementSibling;
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch {}
    out.innerHTML = ok ? `已複製連結，可直接貼到 LINE 或 Email` : `請長按或選取下方連結複製：<input class="share-url" readonly value="${esc(url)}" aria-label="分享連結">`;
    out.querySelector("input")?.select();
  }));
}

function category(cid) {
  hero(false);
  const c = catById(cid);
  if (!c) return home();
  let list = inCat(cid, state.sub).sort(byList);
  if (state.onlyDone) list = list.filter(has);
  if (state.onlyReviewed) list = list.filter(p => p.reviewed);
  if (state.onlyUnreviewed) list = list.filter(p => has(p) && !p.reviewed);
  const sub = c.subs.find(s => s.id === state.sub);
  const guide = sub ? guideBlock(c, sub) : overview(c);
  app.innerHTML = `
    <nav class="crumbs"><a href="#home">首頁</a><span>›</span><span>${esc(c.zh)}</span></nav>
    <section class="cat-title"><h1>${esc(c.zh)}</h1><p>${esc(c.en)}${sub ? ` · ${esc(sub.en)}${sub.zh ? `（${esc(sub.zh)}）` : ""}` : ""}</p>${shareBtn(sub ? "分享這個子主題" : "分享這個主題", "c" + cid + (sub ? "-" + sub.id : ""))}</section>
    <div class="tabs" role="group" aria-label="子主題">
      <button type="button" data-sub="" aria-pressed="${!state.sub}">全部<span>${inCat(cid).length}</span></button>
      ${c.subs.map(s => `<button type="button" data-sub="${s.id}" aria-pressed="${state.sub === s.id}">${esc(s.en)}<span>${inCat(cid, s.id).length}</span></button>`).join("")}
    </div>
    ${guide}

function overview(c) {

function guideBlock(c, s) {

function wireGuide(c, s) {
  const key = `${c.id}-${s.id}`;
  app.querySelector("#g-edit")?.addEventListener("click", () => { state.editingIntro = key; category(c.id); });
  app.querySelector("#g-cancel")?.addEventListener("click", () => { state.editingIntro = null; category(c.id); });
  const status = app.querySelector("#g-status");
  const say = (t, err) => { status.textContent = t; status.classList.toggle("err", !!err); };
  app.querySelector("#g-save")?.addEventListener("click", async e => {
    if (!state.db) return say("目前連不到資料庫，無法儲存。請重新整理頁面後再試。", true);
    const body = { intro: app.querySelector("#g-intro").value.trim(), terms: app.querySelector("#g-terms").value.split("\n").map(x => x.trim()).filter(Boolean), updatedAt: new Date().toISOString() };
    e.target.disabled = true; say("儲存中…");
    try { await state.db.collection("intros").doc(key).set(body); state.intros[key] = body; state.editingIntro = null; category(c.id); }
    catch (err) { e.target.disabled = false; say(err?.code === "invalid_argument" ? "沒有儲存權限，只有網站擁有者可以修改。" : "儲存失敗，請稍後再按一次儲存。", true); }
  });
  app.querySelector("#g-revert")?.addEventListener("click", async e => {
    e.target.disabled = true; say("還原中…");
    try { await state.db.collection("intros").doc(key).delete(); delete state.intros[key]; state.editingIntro = null; category(c.id); }
    catch { e.target.disabled = false; say("還原失敗，請稍後再試。", true); }
  });
}
