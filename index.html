<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cataract & IOL Insight 文獻庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: navy masthead (brand + author) → hero with search on home → topic cards; paper pages read as a one-column clinical summary sheet. */
:root {
  --navy: #0d2440;
  --navy-2: #163458;
  --accent: #0b7d8f;
  --accent-soft: #e1f1f3;
  --bg: #f3f6f9;
  --surface: #ffffff;
  --ink: #142538;
  --muted: #5a6b7d;
  --line: #d9e2ea;
  --on-navy: #e8f1f8;
  --on-navy-muted: #9fb6cc;
  --gold: #c9a35a;
  --danger: #b4423a;
  --font-body: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #0a1a2e; --navy-2: #122a47; --accent: #43b8c9; --accent-soft: #123640;
    --bg: #0f1822; --surface: #16222f; --ink: #e4ecf3; --muted: #95a8ba; --line: #263749;
    --danger: #e0786f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #0a1a2e; --navy-2: #122a47; --accent: #43b8c9; --accent-soft: #123640;
  --bg: #0f1822; --surface: #16222f; --ink: #e4ecf3; --muted: #95a8ba; --line: #263749;
  --danger: #e0786f; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.7 var(--font-body); }
a { color: var(--accent); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.35; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* Masthead */
.mast { background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); }
.mast .wrap { display: flex; align-items: center; gap: 16px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; margin-right: auto; }
.logo { flex: none; height: 54px; display: grid; place-items: center; }
.logo img { height: 48px; width: auto; display: block; }
@media (prefers-color-scheme: dark) { .logo { background: #fff; border-radius: 10px; padding: 0 8px; } }
.brand b { display: block; font-size: 17px; letter-spacing: .01em; }
.brand small { display: block; font-size: 12.5px; color: var(--muted); }
.author { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.45; border-left: 1px solid var(--line); padding-left: 16px; }
.author b { color: var(--ink); font-weight: 600; }
.mode { font-size: 12px; border: 1px solid var(--gold); color: #8a6a2b; border-radius: 999px; padding: 1px 9px; display: inline-block; margin-bottom: 2px; }
.mini-search { flex: 0 1 280px; }
.mini-search input, .hero-search input { width: 100%; border-radius: 10px; border: 1px solid transparent; }
.mini-search input { padding: 7px 12px; background: var(--bg); border-color: var(--line); }

/* Hero */
.hero { background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color: var(--on-navy); }
.hero .wrap { padding-top: 28px; padding-bottom: 36px; display: grid; gap: 16px; }
.hero h1 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 700; max-width: 22em; }
.hero p { margin: 0; color: var(--on-navy-muted); max-width: 40em; }
.hero .ai-note { font-size: 13px; border: 1px solid #2f5178; border-radius: 8px; padding: 6px 12px; justify-self: start; }
.hero-search { max-width: 640px; }
.hero-search input { padding: 13px 16px; font-size: 16px; background: var(--surface); color: var(--ink); }
.hero-stats { display: flex; gap: 28px; flex-wrap: wrap; font-size: 14px; color: var(--on-navy-muted); }
.hero-stats b { color: var(--on-navy); font: 600 22px/1 var(--font-mono); margin-right: 6px; font-variant-numeric: tabular-nums; }

main.wrap { padding-top: 28px; padding-bottom: 56px; display: grid; gap: 32px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 20px; }
.sec-head span { color: var(--muted); font-size: 14px; }
.crumbs { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }

/* Topic cards */
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.topic { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; color: var(--ink); text-decoration: none; align-content: start; border-top: 3px solid var(--accent); }
.topic:hover { box-shadow: 0 6px 22px rgba(13, 36, 64, .10); }
.topic-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.topic h3 { font-size: 20px; }
.topic h3 small { display: block; font: 500 12.5px var(--font-body); color: var(--muted); letter-spacing: .02em; }
.count { font: 600 13px var(--font-mono); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.topic ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13.5px; color: var(--muted); }
.topic li { display: flex; justify-content: space-between; gap: 10px; }
.topic li span:last-child { font-family: var(--font-mono); }
.topic li.zero { opacity: .5; }

/* Recently summarised */
.recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.recent a { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-decoration: none; color: var(--ink); display: grid; gap: 6px; }
.recent a:hover { border-color: var(--accent); }
.recent .k { font-size: 12px; color: var(--accent); font-weight: 600; }
.recent p { margin: 0; font-weight: 500; line-height: 1.55; }

/* Category view */
.cat-title h1 { font-size: 28px; }
.cat-title p { margin: 4px 0 0; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.tabs button span { font: 500 12px var(--font-mono); color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs button[aria-pressed="true"] span { color: rgba(255,255,255,.8); }
.toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.list { display: grid; gap: 10px; }
/* ---- Card grid view for paper lists ---- */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pcard { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding-bottom: 14px; overflow: hidden; text-decoration: none; color: var(--ink); transition: border-color .15s, box-shadow .15s, transform .15s; min-height: 170px; }
.pcard:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(15,40,70,.08); transform: translateY(-2px); }
.locked-txt { color: #7b8794; }
.pcard.locked, .item.locked { background: #eef1f4; border-style: dashed; color: #7b8794; cursor: default; box-shadow: none; transform: none; }
.pcard.locked .band { background: #b9c2cc; opacity: 1; }
.pcard.locked .pc-title, .item.locked .lead { color: #6b7785; }
.pcard.locked:hover, .item.locked:hover { border-color: var(--line); box-shadow: none; transform: none; }
.pcard .band { height: 5px; background: var(--accent); opacity: .75; }
.pcard.must .band { background: #c9a35a; opacity: 1; }
.pcard .pc-top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 16px 0; font-size: 12px; color: var(--muted); }
.pcard .pc-title { padding: 0 16px; font-weight: 650; font-size: 15.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .pc-take { padding: 0 16px; font-size: 13.5px; line-height: 1.6; color: var(--ink-2, #3b4a5a); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .pc-wip { padding: 0 16px; font-size: 13px; color: var(--muted); }
.pcard .pc-foot { margin-top: auto; padding: 4px 16px 0; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.pcard .pc-foot span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .pc-num { font-weight: 700; color: #8a6a26; background: #f6ecd6; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; }
.psec { display: grid; gap: 12px; }
.psec + .psec { margin-top: 22px; }
.psec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.psec-head h3 { margin: 0; font-size: 17px; }
.psec-head h3 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
.more-btn { justify-self: center; margin-top: 4px; }
.viewtog { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.viewtog button { border: 0; background: transparent; padding: 5px 12px; font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.viewtog button[aria-pressed="true"] { background: var(--accent); color: #fff; }
@media (max-width: 640px) { .pgrid { grid-template-columns: 1fr; } .pcard { min-height: 0; } }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: grid; gap: 6px; text-decoration: none; color: var(--ink); }
.item:hover { border-color: var(--accent); }
.item .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.item .lead { font-weight: 600; font-size: 16px; line-height: 1.5; }
.item .en { font-size: 13px; color: var(--muted); line-height: 1.5; }
.item .takeaway { font-size: 14.5px; line-height: 1.6; display: flex; gap: 8px; }
.item .takeaway b { flex: none; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; height: fit-content; margin-top: 2px; }
.chip { border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
.chip.year { font-family: var(--font-mono); }
.chip.wip { border-style: dashed; }
.chip.ok { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.must { background: #f6ecd6; border-color: transparent; color: #7a5a1c; font-weight: 600; }
.guide { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 20px 22px; display: grid; gap: 14px; }
.guide-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.guide h2 { font-size: 16px; color: var(--accent); }
.guide p { margin: 0; }
.guide .hint { color: var(--muted); }
.terms-fold > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--accent); list-style: none; }
.terms-fold > summary::-webkit-details-marker { display: none; }
.terms-fold > summary::after { content: " ▾"; }
.terms-fold[open] > summary::after { content: " ▴"; }
.terms-fold[open] > summary { margin-bottom: 10px; }
.g-more { display: none; justify-self: start; border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-size: 13.5px; cursor: pointer; }
@media (max-width: 640px) { .g-intro:not(.open) { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; } .g-more { display: inline; } .g-more[hidden] { display: none; } }
.terms { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.terms div { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.terms dt { font-weight: 600; font-size: 14px; }
.terms dd { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
.must-list h3 { font-size: 14px; margin-bottom: 4px; }
.must-list ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.must-list li span { color: var(--muted); font: 12.5px var(--font-mono); }
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ov { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: grid; gap: 6px; }
.ov:hover { border-color: var(--accent); }
.ov b { font-size: 15px; }
.ov span { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
.ov small { font-size: 12.5px; color: var(--accent); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer; }
.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

/* Paper sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: clip; max-width: 880px; }
.sheet-head { padding: 26px 30px 22px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.sheet-head h1 { font-size: 23px; font-weight: 700; }
.cite { color: var(--muted); font-size: 14px; }
.orig { font-size: 14.5px; line-height: 1.55; color: var(--ink); }
.orig span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 1px; }
.sheet-body { padding: 26px 30px 30px; display: grid; gap: 24px; }
.keypoint { background: var(--navy); color: var(--on-navy); border-radius: 12px; padding: 18px 20px; }
.keypoint small { display: block; color: var(--gold); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; margin-bottom: 4px; }
.keypoint p { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.6; }
.facts { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.facts div { background: var(--surface); padding: 10px 14px; flex: 1 1 190px; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 14.5px; }
.block h2 { font-size: 15px; color: var(--accent); margin-bottom: 6px; }
.block p, .block ul { margin: 0; }
.block ul { padding-left: 20px; display: grid; gap: 4px; }
.ai { display: grid; gap: 12px; }
.ai-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.ai-head h2 { font-size: 17px; }
.badge-ai.reviewed { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.badge-ai { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.layers-note { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.layer { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.layer-head { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.layer-head h2 { font-size: 16px; }
.layer-head h2 small { font: 500 12.5px var(--font-body); color: var(--muted); margin-left: 8px; }
.layer-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.ln { flex: none; width: 28px; height: 28px; border-radius: 50%; font: 600 14px/28px var(--font-mono); text-align: center; color: #fff; }
.layer.evidence .layer-head { background: var(--accent-soft); } .layer.evidence .ln { background: var(--accent); }
.layer.authors .layer-head { background: var(--bg); } .layer.authors .ln { background: var(--navy-2); }
.layer.implication { border-style: dashed; } .layer.implication .ln { background: var(--muted); }
.layer-body { padding: 14px 18px 16px; display: grid; gap: 6px; }
.layer-body h4 { margin: 6px 0 0; font-size: 13.5px; color: var(--accent); }
.layer-body h4:first-child { margin-top: 0; }
.layer-body p, .layer-body ul { margin: 0; }
.layer-body ul { padding-left: 20px; display: grid; gap: 4px; }
.ed-layer { font-size: 15px; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.ed-layer span { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); }
.block.apply { background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; }
.source { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.srcnote { font-size: 13px; color: var(--muted); word-break: break-all; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 14px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.ghost-danger { color: var(--danger); }
.btn:disabled { opacity: .55; cursor: default; }
.localpath { font: 12px/1.5 var(--font-mono); color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.localpath code { flex: 1 1 300px; word-break: break-all; }
.pending { border: 1px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); }
.edited { font-size: 12.5px; color: var(--muted); }

/* Editor */
.editor { display: grid; gap: 16px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13.5px; font-weight: 600; }
.field .hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--bg); line-height: 1.6; }
.field textarea { resize: vertical; min-height: 84px; }
.field.big textarea { font-size: 16px; font-weight: 600; min-height: 70px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; position: sticky; bottom: 0; background: var(--surface); padding: 12px 0 4px; border-top: 1px solid var(--line); }
.status { font-size: 13.5px; color: var(--muted); }
.status.err { color: var(--danger); }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer .wrap { padding-top: 20px; padding-bottom: 28px; display: grid; gap: 4px; }
@media (max-width: 640px) {
  .author { display: none; }
  .mast .wrap { gap: 10px; padding-top: 10px; padding-bottom: 10px; }
  .mini-search { flex: 1 1 100%; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scrollbar-width: none; }
  .tabs button { flex: none; }
  .sheet-head, .sheet-body { padding-left: 18px; padding-right: 18px; }
  .hero .wrap { padding-top: 22px; padding-bottom: 26px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Figures */
.figs { display: grid; gap: 14px; margin-top: 4px; }
.fig { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 12px; background: var(--surface); display: grid; gap: 10px; }
.fig-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.fig-head h5 { margin: 0; font-size: 14.5px; color: var(--ink); }
.fig-kind { font-size: 11.5px; color: var(--muted); white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.fig-cap { margin: 0; font-size: 13.5px; color: var(--ink); line-height: 1.7; }
.layer-body .fig p { max-width: none; }
.fig-zoom + .fig-note { text-align: center; margin-top: -4px; }
.fig-src { margin: 0; font-size: 12px; color: var(--muted); }
.fb { display: grid; gap: 8px; }
.fb-row { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 10px; align-items: center; }
.fb-label { font-size: 13px; color: var(--ink); text-align: right; line-height: 1.3; }
.fb-bars { display: grid; gap: 3px; }
.fb-track { display: flex; align-items: center; gap: 8px; min-height: 18px; }
.fb-fill { height: 16px; border-radius: 0 4px 4px 0; min-width: 2px; }
.fb-val { font-family: var(--font-mono); font-size: 12px; color: var(--ink); white-space: nowrap; }
.fb-na { font-size: 12px; color: var(--muted); }
.fig-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.fig-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.fig svg { width: 100%; height: auto; display: block; }
.fig svg text { font-family: var(--font-body); fill: var(--muted); font-size: 12px; }
.fig svg .v { fill: var(--ink); font-family: var(--font-mono); font-size: 11.5px; }
.fig-table { overflow-x: auto; max-width: 100%; }
.fig, .figs, .figs-wrap { min-width: 0; }
.fig-table th { white-space: nowrap; }
@media (max-width: 600px) { .fig-table table { min-width: 560px; } }
.fig-table table { border-collapse: collapse; width: 100%; font-size: 13px; }
.fig-table th, .fig-table td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.fig-table th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--accent-soft); }
.fig-table td:not(:first-child) { font-family: var(--font-mono); font-size: 12.5px; }
.fig img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); background: #fff; justify-self: center; }
.fig-tools { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.fig-form { border: 1px dashed var(--accent); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.fig-form .row2 { gap: 10px; }
.fig-form .hint, .fig-note { font-size: 12px; color: var(--muted); }
.fig-add { justify-self: start; }
.fig-form [hidden] { display: none !important; }
.fig-form select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
@media (max-width: 600px) { .fb-row { grid-template-columns: 1fr; gap: 3px; } .fb-label { text-align: left; } }
.fig-zoom { all: unset; cursor: zoom-in; justify-self: center; display: block; max-width: 100%; }
.fig-zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.zoom-ov { position: fixed; inset: 0; z-index: 100; background: rgba(5, 12, 22, .92); display: grid; place-items: center; gap: 10px; padding: 16px; cursor: zoom-out; }
.zoom-ov img { max-width: 100%; max-height: calc(100vh - 70px); object-fit: contain; background: #fff; border-radius: 6px; }
.zoom-ov span { color: #cfdbe6; font-size: 13px; }
/* Full-width, justified body text (CJK reads evenly when both edges align) */
@media (min-width: 700px) { .layer-body p, .layer-body li, .guide p, .block p, .block li, .fig-cap { text-align: justify; text-justify: inter-character; } }
@media (max-width: 600px) { .facts div { flex: 1 1 40%; padding: 8px 12px; } .facts dd { font-size: 13.5px; } }
.lockbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
.lockbar.locked { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.unlockf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 400; }
.unlockf input { width: 90px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); letter-spacing: .2em; }
.figs-first { display: grid; gap: 6px; }

  body > * { display: none !important; }

}
.jump { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; margin: -8px 0 0; background: var(--surface); border-bottom: 1px solid var(--line); }
.jump::-webkit-scrollbar { display: none; }
.jump button { flex: none; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.jump button:hover { border-color: var(--accent); color: var(--accent); }
.jump button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media print { .jump { display: none; } }
.fold > summary, details.layer > summary { list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.fold > summary::-webkit-details-marker, details.layer > summary::-webkit-details-marker { display: none; }
.fold > summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
.fold > summary h4 { margin: 6px 0 0; }
.fold { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.fold:last-child { border-bottom: none; padding-bottom: 0; }
.fold-body { display: grid; gap: 6px; margin-top: 6px; }
.fold > summary:focus-visible, details.layer > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
.chev { flex: none; display: inline-flex; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
.chev::after { content: "展開 ▾"; }
.fold[open] > summary .chev::after, details.layer[open] > summary .chev::after { content: "收合 ▴"; }
details.layer > summary.layer-head { align-items: center; }
details.layer > summary .lh-text { flex: 1; min-width: 0; }
details.layer:not([open]) > summary.layer-head { border-bottom: none; }
summary:hover .chev { color: var(--accent); }
.jump-all { margin-left: auto; color: var(--accent) !important; border-color: var(--accent) !important; }
.share { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cat-title .share { margin-top: 10px; }
.share-out { font-size: 12.5px; color: var(--accent); display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.share-url { font: inherit; font-size: 12px; width: min(420px, 80vw); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.fig-ref { margin: 0; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px; font-size: 13px; color: var(--muted); }
.hero-live { display: inline-block; margin-left: 10px; padding: 1px 10px; border-radius: 999px; font-size: 0.85em; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); white-space: nowrap; vertical-align: 1px; }
.hero { overflow: hidden; }
.hero .wrap { position: relative; }
.hero-art { position: absolute; right: -40px; top: 0; height: 100%; width: 66%; pointer-events: none; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 34%); mask-image: linear-gradient(90deg, transparent 0%, #000 34%); }
.hero .wrap > *:not(.hero-art) { position: relative; max-width: 600px; }
.hero-art .ha-tw { animation: ha-tw 6s ease-in-out infinite; }
@keyframes ha-tw { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .hero-art .ha-tw { animation: none; } .hero-art .ha-sat { display: none; } }
.hero-art .ha-tw { animation: ha-tw 6s ease-in-out infinite; }
@keyframes ha-tw { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .hero-art .ha-tw { animation: none; } .hero-art .ha-sat { display: none; } }
@media (max-width: 1100px) { .hero-art { width: 70%; right: -6%; opacity: .4; } .hero-art .ha-eq, .hero-art .ha-wave { display: none; } }
@media (max-width: 600px) { .hero-art { width: 120%; right: -14%; height: auto; top: 40px; opacity: .3; } }

<script id="catalog" type="application/json">{"updated": "2026-11-11", "categories": [{"id": "01", "en": "Optical Design", "zh": "光學設計", "subs": [{"id": "01", "en": "Refraction & Diffraction", "zh": "折射、繞射與景深原理", "intro": "IOL 把光聚焦到視網膜，靠的是兩種基本光學機制：折射（光通過不同介質時改變方向，鏡片曲率決定度數）與繞射（光通過微小階梯結構時產生干涉，可以把光分配到多個焦點）。單焦 IOL 以折射為主；多焦 IOL 多用繞射環；EDOF 則透過特殊的波前或像差設計拉長焦深。理解這些原理，是比較各種 IOL 設計的基礎。", "terms": ["折射（Refraction）：光進入不同介質時偏折，遵循 n₁ sin θ₁ = n₂ sin θ₂", "繞射（Diffraction）：光遇到微小結構時產生干涉，繞射環把光分配到不同焦點", "景深（Depth of Focus）：成像仍可接受的前後範圍，EDOF 設計的核心指標", "光能分配：多焦 IOL 把入射光分給各焦點的比例，影響各距離的對比"]}, {"id": "02", "en": "Aberrations & Image Quality", "zh": "球差、高階像差、MTF/PSF 與光學量測", "intro": "IOL 的成像品質取決於它和角膜像差的搭配。角膜通常帶有正球差，非球面 IOL 以零或負球差設計來中和，目的是提升對比敏感度，在瞳孔較大時差異更明顯。不同族群的角膜球差分佈不同，選擇非球面設計時可以參考本地族群的資料。 評估成像品質常用 MTF、PSF 等指標，可在光學台或模型眼上量測，作為比較不同設計的客觀依據。", "terms": ["球差（SA）：光線通過鏡片邊緣與中央的聚焦位置不同，瞳孔越大影響越明顯", "MTF：調制轉換函數，描述鏡片把不同細緻度的影像傳遞出來的能力", "Strehl ratio：實際成像峰值與理想成像的比值，越接近 1 越好"]}, {"id": "03", "en": "Positioning & Dysphotopsia", "zh": "傾斜、偏心、囊袋穩定與光學干擾", "intro": "IOL 的光學設計要發揮作用，前提是在眼內的位置正確。偏心與傾斜會降低非球面 IOL 的成像品質，球差矯正越強的設計對位置越敏感。鏡片的 haptic 與單片式、三片式結構會影響囊袋內的穩定性；光學區邊緣設計則和術後眩光、暗影等 dysphotopsia 有關。", "terms": ["Decentration：IOL 光學中心偏離視軸", "Tilt：IOL 平面相對於視軸傾斜", "Dysphotopsia：術後出現的光暈、光條（positive）或顳側暗影（negative）"]}]}, {"id": "02", "en": "Biometry & Formula", "zh": "生物量測與計算", "subs": [{"id": "01", "en": "IOL Formulas & ELP", "zh": "公式比較、ELP、A-constant", "intro": "IOL 度數計算的核心，是預測鏡片在眼內的最終位置（ELP）。新一代公式（Barrett、Kane、EVO 等）在一般眼睛已相當準確；但在鞏膜固定、睫狀溝等非囊袋內的位置，ELP 會改變，常需要調整 A-constant 或度數。這個資料夾目前以鞏膜固定的度數計算研究為主。", "terms": ["ELP：有效鏡片位置，即 IOL 在眼內與角膜的實際距離", "PE（Prediction Error）：術後實際屈光與預測值的差", "A-constant：公式中代表鏡片位置特性的常數，可依臨床數據優化"]}, {"id": "02", "en": "Post-LASIK & Post-RK", "zh": "屈光手術後度數計算"}, {"id": "03", "en": "Toric Calculation", "zh": "Toric 計算、PCA、SIA", "intro": "Toric 度數計算除了前角膜 K 值，還要考慮後角膜散光（PCA）與手術誘發散光（SIA）。新一代 toric 公式與 Total Keratometry 已把這些因素納入，不同公式在大樣本中的準確度可以直接比較。閱讀 toric 研究的結果前，也建議先熟悉散光向量分析與標準化報告格式。", "terms": ["PCA：後角膜散光，多為逆規，會抵銷部分順規前角膜散光", "TK（Total Keratometry）：同時量測前、後角膜的總角膜屈光度", "向量分析：把散光的度數與軸向一起計算", "Double-angle plot：把散光軸角度加倍後作圖，用來呈現散光分佈"]}]}, {"id": "03", "en": "IOL Technology", "zh": "人工水晶體", "subs": [{"id": "01", "en": "PC-IOLs (Presbyopia-Correcting)", "zh": "老花矯正 IOL：EDOF、多焦與增強型單焦", "intro": "老花矯正 IOL (Presbyopia-correcting IOLs，PC-IOLs）讓病人術後不依賴眼鏡也能看清不同距離，是 premium IOL 的核心。依光學設計大致分為三類：多焦 (繞射式或折射式，把光分到兩個以上焦點，近距離較好但光暈較明顯）、延焦 EDOF (把單一焦點拉長，光學干擾較少）、增強型單焦 (只小幅度延長景深）。設計分類名稱常讓人混淆，ESCRS 近期改以病人實際能達到的視覺範圍來分類。選擇時要同時考量角膜像差、angle kappa、瞳孔大小與病人對光暈的接受度。", "terms": ["Multifocal / Trifocal：把光分到遠、中/近 多個焦點，多以繞射環設計", "EDOF：延伸景深，依 AAO 共識，單眼景深需比單焦多至少 0.5 D", "增強型單焦 (Monofocal plus)：在單焦基礎上小幅延長景深", "Range of Field：可用視力涵蓋的距離範圍，ESCRS 分為部分範圍與完整範圍", "Defocus curve：離焦曲線，呈現出視力隨距離的變化程度", "Angle kappa：瞳孔中心與視軸的夾角，過大時可能影響多焦 IOL 的表現"]}, {"id": "02", "en": "Toric IOLs", "zh": "散光矯正設計、PAC 與旋轉穩定性", "intro": "Toric IOL 用來矯正角膜散光，術後效果取決於三件事：度數計算、軸位對準與鏡片的旋轉穩定性。一般估計 toric 每偏離 1° 約損失 3% 的散光矯正效果，現代 toric IOL 術後平均旋轉約 2–3°。另一個較新的議題是角膜散光從中央到周邊並不一致，瞳孔放大時有效散光會變小，漸進式 toric（PAC）設計就是針對這一點。", "terms": ["WTR / ATR：順規 / 逆規散光，年紀越大越常轉為 ATR", "PAC（Progressive Axial Correction）：柱鏡度由光學區中央往周邊遞減的 toric 設計", "旋轉穩定性：術後 IOL 軸位與植入時軸位的差異，常以平均絕對旋轉與 5° 以內比例表示"]}, {"id": "03", "en": "IOL Material & Platform", "zh": "材料、glistening、PCO 與植入系統", "intro": "IOL 平台包含鏡片材料與植入系統。材料主要分為疏水性壓克力、親水性壓克力與矽膠，會影響 glistening、後囊混濁（PCO）與長期透明度；疏水性壓克力搭配方銳邊是目前降低 PCO 的主流。植入系統方面，預裝式推注器已成主流，研究關注所需切口大小、推注阻力穩定性與鏡片展開速度。", "terms": ["Glistening：鏡片材料內形成的微小充水空泡，可能增加散射光", "PCO：後囊混濁，俗稱「次發性白內障」，需以 YAG 雷射處理", "Tg：玻璃轉化溫度，影響壓克力材料的柔軟度與展開速度", "Preloaded IOL：出廠前已裝入推注器的 IOL，免去手術室裝載步驟", "Wound-assisted injection：推注器前端只抵住切口而不完全進入，可縮小所需切口"]}]}, {"id": "04", "en": "Complex Surgery", "zh": "複雜性手術", "subs": [{"id": "01", "en": "PCR & Vitreous Management", "zh": "後囊破裂與玻璃體處置", "intro": "後囊破裂（PCR）是白內障手術最常見的術中併發症之一。處置是否得當，會影響玻璃體脫出的程度、IOL 能放在哪裡，以及術後視力與視網膜併發症。了解破裂最常發生在哪個步驟，有助於預防與事先準備備案。", "terms": ["PCR：後囊破裂", "Anterior vitrectomy：前部玻璃體切除，用來清除脫出的玻璃體", "Backup IOL：囊袋無法使用時的備案鏡片，通常為三片式"]}, {"id": "02", "en": "Sulcus Fixation & Optic Capture", "zh": "睫狀溝植入與 optic capture", "intro": "後囊破裂但前囊仍完整時，睫狀溝植入是常見的備案。關鍵原則有三：睫狀溝應使用三片式 IOL，單片式壓克力 IOL 放在睫狀溝容易摩擦虹膜，引起色素播散、出血或眼壓上升；度數通常要比囊袋內略減；若前囊口完整，可做 optic capture 提升穩定性與置中。", "terms": ["Optic capture：把三片式 IOL 的光學區從前囊口下方推入、haptic 留在睫狀溝", "UGH syndrome：IOL 摩擦虹膜造成的葡萄膜炎、青光眼與前房出血"]}, {"id": "03", "en": "Yamane & Scleral Fixation", "zh": "Yamane 與鞏膜固定", "intro": "沒有囊袋支撐時，二次 IOL 的選項包括前房 IOL、虹膜固定 IOL，以及鞏膜固定（縫線或無縫線）。2017 年發表的 Yamane 雙針 flange 術式不需縫線、固定穩定，已成為主流做法。目前證據顯示它與縫線固定的長期結果相當、手術時間較短；研究重點已轉向 flange 製作、haptic 固定力、IOL 度數選擇與長期穩定性。", "terms": ["Flange：燒灼 haptic 末端形成的膨大結構，卡在鞏膜隧道中固定 IOL", "ISHF：鞏膜內 haptic 固定（intrascleral haptic fixation）", "30G 薄壁針：Yamane 術式用來穿刺鞏膜並引導 haptic 的針具"]}, {"id": "04", "en": "IOL Subluxation & Exchange", "zh": "IOL 脫位與置換", "intro": "IOL 或水晶體半脫位、脫位多與懸韌帶無力有關，例如假性脫皮症候群、高度近視、外傷或曾接受玻璃體手術，可能在白內障手術多年後才發生。處置方式依脫位程度與位置而定：重新固定原 IOL，或取出後改用鞏膜固定、虹膜固定 IOL；後脫位通常需要與玻璃體視網膜科合作。", "terms": ["Zonular weakness：懸韌帶無力", "PXF：假性脫皮症候群，晚期 IOL 脫位的常見危險因子", "In-the-bag dislocation：IOL 連同囊袋一起脫位"]}]}, {"id": "05", "en": "Others · Society Articles", "zh": "其他資料（醫學會文章）", "subs": [{"id": "01", "en": "Society & Magazine Articles", "zh": "醫學會刊物與專業雜誌文章（EyeNet、EyeWorld、CRST）", "intro": "這裡收錄醫學會刊物與專業雜誌的文章，例如 AAO EyeNet、EyeWorld 與 CRST。這類文章多為專家經驗分享、技術要點或會議重點整理，未經正式期刊同儕審查；引用時請與正式發表的期刊論文分開看待。", "terms": []}, {"id": "02", "en": "Congress Abstracts & Posters", "zh": "年會口頭報告摘要與海報（ESCRS 等）", "intro": "這裡收錄醫學會年會的口頭報告摘要與海報，例如 ESCRS。內容多為初步結果，篇幅有限、細節較少，部分研究之後才會以正式論文發表；引用時請優先查找是否已有對應的期刊版本。", "terms": []}]}], "papers": [{"id": "p3c56098a", "cat": "01", "sub": "02", "year": 2015, "title": "Distribution of corneal and ocular spherical aberrations in eyes with cataract in the Taiwanese population", "titleZh": "台灣白內障患者的角膜與全眼球差分佈", "doi": "10.1016/j.tjo.2015.03.003", "mustRead": true, "mustRank": 1}, {"id": "p2254d58e", "cat": "01", "sub": "03", "year": 2022, "title": "Dysphotopsias or Unwanted Visual Phenomena after Cataract Surgery", "titleZh": "白內障術後眩光與異常視覺現象（d mir Besek N, Cubuk MO, Kirgiz A", "journal": "Arquivos Brasileiros de Oftalmologia", "citation": "Arq Bras Oftalmol. 2025;88(5):e2024-0328", "doi": "10.5935/0004-2749.2024-0328", "studyType": "回溯性觀察世代研究（單一中心）", "n": "25,224 例手術中 351 眼發生 PCR", "tags": ["PCR", "玻璃體脫出", "危險因子", "睫狀溝植入", "鞏膜固定"], "conclusion": "單一中心 25,224 例超音波乳化術的 PCR 發生率為 1.3%；經適當處置，一年後 79.4% 的眼睛 BCVA 達 0.30 logMAR 或更好。", "about": "土耳其一家三級眼科醫院回溯 2017–2022 年 25,224 例超音波乳化術，納入發生 PCR (定義為術中後囊撕裂合併玻璃體脫出) 且追蹤滿一年的 351 眼，分析術前危險因子、PCR 發生的手術階段、IOL 植入位置，以及術後一年內的併發症與視力。所有 PCR 眼都接受前段玻璃體切除；囊袋無法支撐時，睫狀溝可支撐就植入三片式 IOL，否則改用鞏膜固定。", "keyResults": ["PCR 發生率 1.3% (351/25,224)；住院醫師 1.6%、主治醫師 1.2% (p = 0.006)", "術前危險因子：假性脫皮 (PEX) PCR 率 3.2%、褐色白內障 3.4%、成熟白內障 2.8%", "PCR 最常發生在乳化階段 (63%)，其次為 I&A (23.4%)；發生階段與一年 BCVA、早晚期併發症都沒有顯著相關", "同次手術植入 IOL 73.2%：睫狀溝 56.1%、囊袋 10.3%、鞏膜固定 6.8%；26.8% 暫時維持無水晶體，平均 2.77 個月後二次植入 (Z suture 鞏膜固定 54 眼、Yamane 17 眼、睫狀溝 15 眼）", "術中併發症：水晶體碎片掉入玻璃體 8% (其中 9 眼需玻璃體切除) 、虹膜損傷 7.1%", "早期併發症：角膜水腫 55.6%、眼壓升高 33.3%；晚期併發症：持續眼壓升高 11.1%、CME 5.1%、視網膜剝離 2.5%、IOL 脫位 1.4%", "BCVA (logMAR) 由術前 1.31 改善至一年 0.51 (p < 0.001)；79.4% (279/351) 達 0.30 或更好"], "clinical": "術前可以 PEX、成熟或褐色白內障等因素辨識 PCR 風險較高的病例。這篇的數據也可作為術前說明的參考範圍：即使發生 PCR，多數患者一年後仍能恢復可用視力，但 CME 與視網膜剝離需要較長期追蹤。此為單一中心結果，各院的發生率與預後可能不同。", "limitations": ["回溯性、無對照組（未發生 PCR 的病例術後一個月即轉出，缺少長期資料）", "單一轉診中心，主治醫師負責較困難的病例，住院醫師與主治醫師的 PCR 率比較可能受影響", "術者經驗只分兩級，無法依年資或手術量細分"], "authorsView": "作者認為 PCR 是超音波乳化術無法完全避免的併發症，發生率會隨術者經驗增加而下降；PEX 等高風險族群需要更加小心。發生 PCR 的患者應以跨科方式長期追蹤 CME、視網膜剝離與眼壓等問題，並預期可能需要二次手術；只要處置得當，仍能獲得令人滿意的視力與解剖結果。", "figures": [{"kind": "line", "title": "PCR 患者的 BCVA 變化（logMAR，數值越低越好）", "labels": ["術前", "術後 1 天", "1 週", "1 個月", "3 個月", "6 個月", "1 年"], "series": [{"name": "平均 BCVA", "values": [1.31, 1.57, 0.88, 0.76, 0.62, 0.6, 0.51]}], "unit": "", "lowerBetter": true, "caption": "術後第 1 天視力最差，之後逐步改善；除第 1 天外，各時間點都顯著優於術前（p < 0.001）。", "source": "依原文 Figure 1 與 Results 數據重繪（Koser et al., Arq Bras Oftalmol 2025，CC BY 4.0）", "decimals": 2}, {"kind": "bar", "title": "不同族群的 PCR 發生率", "labels": ["全部病例", "假性脫皮（PEX）", "褐色白內障", "成熟白內障", "住院醫師執刀", "主治醫師執刀"], "series": [{"name": "PCR 發生率", "values": [1.3, 3.2, 3.4, 2.8, 1.6, 1.2]}], "unit": "%", "caption": "假性脫皮（PEX）、褐色與成熟白內障的 PCR 發生率都高於整體的 1.3%；住院醫師執刀的 PCR 率顯著高於主治醫師（p = 0.006）。", "source": "依原文 Results 數據重繪（Koser et al., Arq Bras Oftalmol 2025，CC BY 4.0）"}, {"kind": "table", "title": "PCR 發生的手術階段與一年視力", "columns": ["手術階段", "眼數（%）", "一年 BCVA（logMAR）"], "rows": [["Capsulorhexis", "13（3.7%）", "0.67 ± 0.88"], ["Sculpting", "6（1.7%）", "0.95 ± 0.76"], ["Phacoemulsification", "221（63%）", "0.39 ± 0.46"], ["Irrigation & aspiration", "82（23.4%）", "0.43 ± 0.58"], ["IOL 植入與 OVD 移除", "29（8.2%）", "0.38 ± 0.60"]], "caption": "較早階段發生 PCR 的眼睛，一年視力數值上較差，但差異未達統計顯著（p = 0.67）。", "source": "整理自原文 Table 2（Koser et al., Arq Bras Oftalmol 2025，CC BY 4.0）"}], "titleZh": "超音波乳化術中後囊破裂 (PCR) 的臨床特徵、處置與結果", "mustRead": true, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T02:34:13.140Z", "mustRank": 1}, {"id": "pe7f0b458", "cat": "04", "sub": "01", "year": 2025, "title": "Timing of posterior capsular rupture during cataract surgery", "authors": "Narayan A, Neo YN, Lockington D, Day AC", "journal": "Eye", "citation": "Eye. 2025;39:2708–2712", "doi": "10.1038/s41433-025-03942-8", "studyType": "回溯性觀察研究（單一中心，連續病例）", "n": "1,042 眼（皆為 PCR 病例）", "tags": ["PCR", "手術階段", "前囊撕裂", "睫狀溝", "Optic capture"], "conclusion": "PCR 最常發生在乳化階段 (60%)，其次是 I/A (24%)；合併前囊撕裂時，PCR 較常發生在較早的階段，IOL 植入位置也明顯不同。", "about": "英國 Moorfields 眼科醫院回溯 2014–2018 年所有併發 PCR 的白內障手術，共 1,042 眼 (排除合併角膜、青光眼手術或 phacovitrectomy，以及未清楚記錄 PCR 發生階段的病例)。研究把手術分成六個階段：水分離、乳化、I/A、IOL 植入、移除黏彈劑、傷口水合；主要分析 PCR 發生在哪個階段，次要分析前囊撕裂、其他術中併發症與 IOL 植入位置。乳化使用 Alcon Infiniti 或 Centurion，多數病例以雙手式金屬 I/A 頭吸除皮質。", "keyResults": ["PCR 發生階段：乳化 621 眼 (60%)、I/A 248 眼 (24%)、IOL 植入 87 眼 (8%)、移除黏彈劑 44 眼 (4%)、水分離 40 眼 (3%)、傷口水合 2 眼", "合併的術中併發症：玻璃體脫出 80%、前囊撕裂 15%、核或碎片掉入玻璃體 12%、懸韌帶斷裂 5%", "IOL 植入位置：睫狀溝 60%、睫狀溝加 optic capture 19%、囊袋 11%、前房 IOL 2%、維持無水晶體 8%", "有前囊撕裂與前囊完整相比：PCR 發生在水分離或乳化階段的比例為 80% 與 61%；兩組的 PCR 發生階段與 IOL 植入位置分布都有顯著差異（p < 0.01），年齡與性別無差異", "有前囊撕裂者：optic capture 3.9% (vs. 前囊完整 20.7%)、維持無水晶體 19.4% (6.4%)、植入囊袋 4.5% (12.4%）", "最常使用的 IOL 為三片式 MA60AC (79%），其次為單片式 SN60WF (10%）"], "clinical": "乳化與 I/A 合計約占 PCR 的八成，可作為手術訓練與術中風險提醒的重點階段。術中發現前囊撕裂時，後續步驟需留意破裂延伸，並預期 optic capture 的機會較低，可提前準備睫狀溝、前房或鞏膜固定的備案。此為單一中心回溯資料，且沒有 PCR 發生率，不能用來比較不同術式或器械的風險。", "limitations": ["回溯性、單一中心，資料來自電子病歷關鍵字搜尋；只納入 PCR 病例，無法得知 PCR 發生率", "手術階段分類較粗，例如乳化階段沒有細分刻槽、劈核與移除核碎片", "I/A 方式混合雙手式、自動與 Simcoe，器械無法統一", "未分析術者等級、白內障分級與懸韌帶狀況等術前因素"], "authorsView": "作者認為 PCR 最可能發生在乳化階段，與過去文獻一致。早期研究多報告 I/A 階段最常見，作者推測雙手式 I/A 等器械進步可能降低了這個階段的風險，矽膠 I/A 頭也有助於進一步降低風險。作者也認為前囊撕裂會使 PCR 傾向發生在水分離與乳化等較早階段，並影響 IOL 植入位置：前囊與後囊都有破損時，支撐可能不足，因此較多醫師選擇維持無水晶體或植入前房 IOL。\n\n作者另指出，多數後囊破口邊緣看不清楚，發生 PCR 時睫狀溝植入可能比囊袋植入更合適；optic capture 的優點是穩定度較好，且不需調整度數。", "figures": [{"kind": "bar", "title": "PCR 發生在手術的哪個階段（1,042 眼）", "labels": ["水分離", "乳化", "I/A", "IOL 植入", "移除黏彈劑", "傷口水合"], "series": [{"name": "比例", "values": [3.8, 59.6, 23.8, 8.3, 4.2, 0.2]}], "unit": "%", "max": 100, "caption": "乳化與 I/A 合計約占 83%。", "source": "依原文 Table 3 與 Results 數據重繪（Narayan et al., Eye 2025，CC BY 4.0）", "decimals": 1}, {"kind": "bar", "title": "PCR 發生階段：有前囊撕裂 vs 前囊完整", "labels": ["水分離", "乳化", "I/A", "IOL 植入", "移除黏彈劑", "傷口水合"], "series": [{"name": "有前囊撕裂（155 眼）", "values": [8.4, 71.0, 16.1, 3.2, 1.3, 0]}, {"name": "前囊完整（887 眼）", "values": [3.0, 57.5, 25.3, 9.2, 4.7, 0.2]}], "unit": "%", "max": 100, "caption": "有前囊撕裂時，PCR 較集中在水分離與乳化等較早階段（p < 0.01）。", "source": "依原文 Table 4 數據重繪（Narayan et al., Eye 2025，CC BY 4.0）", "decimals": 1}, {"kind": "bar", "title": "IOL 植入位置：有前囊撕裂 vs 前囊完整", "labels": ["睫狀溝", "睫狀溝＋optic capture", "囊袋", "前房 IOL", "維持無水晶體"], "series": [{"name": "有前囊撕裂（155 眼）", "values": [68.4, 3.9, 4.5, 3.9, 19.4]}, {"name": "前囊完整（887 眼）", "values": [58.4, 20.7, 12.4, 2.0, 6.4]}], "unit": "%", "max": 100, "caption": "有前囊撕裂時，optic capture 與囊袋植入明顯較少，維持無水晶體的比例較高（p < 0.01）。", "source": "依原文 Table 4 數據重繪（Narayan et al., Eye 2025，CC BY 4.0）", "decimals": 1}], "titleZh": "白內障手術中後囊破裂發生的時間點", "mustRead": false, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T03:24:05.858Z", "liveFigures": [{"addedAt": "2026-11-11T03:13:30.772Z", "alt": "術中併發症與IOL置放位置", "assetId": "76c14ec33611b7c0d0241dbca20bf940", "caption": "底色標示為本站加註", "editedAt": "2026-11-11T03:23:42.153Z", "kind": "image", "source": "原文 Table 2（Narayan A et al., Eye. 2025;39:2708–2712）", "title": "術中併發症與IOL置放位置"}], "liveOrder": ["b0", "2026-11-11T03:13:30.772Z", "b1", "b2"]}, {"id": "p283d217e", "cat": "04", "sub": "02", "year": 2026, "title": "Advances and Challenges in Sulcus-Implanted Intraocular Lenses: A Comprehensive Narrative Review", "authors": "Romano MR, Savastano A, Keegan D, Toro MD, Vidal-Aroca F, Di Simplicio S, Stanzel B, Fasolino G, Cabrera F, Rizzo S", "journal": "Ophthalmology and Therapy", "citation": "Ophthalmol Ther. 2026;15:1205–1232", "doi": "10.1007/s40123-026-01331-2", "studyType": "敘述性回顧 (Narrative review)", "n": "50 篇研究", "tags": ["睫狀溝", "三片式 IOL", "附加型 IOL", "次發性 IOL", "併發症"], "conclusion": "睫狀溝植入的效果與安全性高度取決於 IOL 設計：三片式與專為睫狀溝設計的附加型IOL表現最好，單片式壓克力 IOL 的併發症風險較高。", "about": "以 PubMed 檢索加上人工追查參考文獻，納入 50 篇報告睫狀溝 IOL 臨床結果的研究，涵蓋三片式鏡片、附加型(supplementary / add-on) 鏡片，以及放在睫狀溝的一般 IOL；適應症包括無水晶體、懸韌帶無力、IOL 脫位、後囊破裂與屈光補強。數值依各研究原始報告呈現，沒有做標準化合併或統計比較。", "keyResults": ["病例選擇適當時，術後視力多改善 0.10–0.30 logMAR，許多研究報告 20/40 或更好", "三片式 IOL：CME 1–8%、色素播散 0–12%、眼壓升高 1–9%", "單片式壓克力 IOL：虹膜摩擦、色素播散、眼壓升高與 UGH 症候群的風險持續較高", "專為睫狀溝設計的附加型鏡片：置中良好、傾斜與偏位低，且可取出", "50 篇中報告各類併發症的研究數：CME 8 篇、視網膜剝離 8 篇、色素播散 5 篇、角膜水腫 4 篇、虹膜摩擦 1 篇、UGH 症候群 1 篇", "一項兒童研究：睫狀溝固定眼的續發性青光眼 28.57%，囊袋固定眼 10.53%（p = 0.007）"], "clinical": "這篇整理了睫狀溝 IOL 的整體證據，與 2009 年 ASCRS 報告的結論一致：單片式壓克力 IOL 不適合放在睫狀溝。由於是敘述性回顧、資料異質性高，文中的百分比較適合當作範圍參考，不宜直接用來比較不同鏡片或技術的優劣。", "limitations": ["敘述性回顧，未依 PRISMA 系統性方法，沒有統合分析或偏差風險評估", "納入研究多為回溯性病例系列，適應症、併發症定義與追蹤時間差異大", "多款附加型鏡片上市時間較短，長期資料有限"], "authorsView": "作者認為睫狀溝植入應視為一系列技術，而非單一手術；鏡片設計、固定方式與病人選擇配合得當時，睫狀溝 IOL 能帶來有意義的視力恢復。作者指出證據不支持把單片式壓克力 IOL 放在睫狀溝；三片式壓克力、矽膠或單片 PMMA 仍是無囊袋支撐時的主要選項。對有殘餘屈光誤差或老花需求的人工水晶體眼，專為睫狀溝設計的附加型鏡片在部分病人可能優於換片或角膜手術。作者呼籲從臨時性的仿單外使用，轉向更標準化的睫狀溝專用平台，並向病人充分說明可逆性與長期的不確定性。", "figures": [{"kind": "bar", "title": "50 篇研究中，報告各類術後併發症的研究篇數", "labels": ["CME", "視網膜剝離", "色素播散", "角膜水腫", "虹膜摩擦", "UGH 症候群"], "series": [{"name": "研究篇數", "values": [8, 8, 5, 4, 1, 1]}], "unit": " 篇", "caption": "這是「有報告該併發症的研究數」，不是發生率，也不能用來比較不同鏡片或技術。", "source": "依原文 Table 3 與 Fig. 2 數據重繪（Romano et al., Ophthalmol Ther 2026，CC BY-NC 4.0）"}], "titleZh": "睫狀溝植入 IOL 的進展與挑戰：全面敘述性回顧", "mustRead": true, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T06:01:30.300Z", "mustRank": 2}, {"id": "p0ebc5bd0", "cat": "04", "sub": "02", "year": 2022, "title": "Three-piece intraocular lens in the sulcus with optic capture in patients with mild to moderate zonular weakness in exfoliation", "authors": "Bhaskaran J, Narayanan S, Balamurali R", "journal": "Indian Journal of Ophthalmology", "citation": "Indian J Ophthalmol. 2022;70:4312–4318", "doi": "10.4103/ijo.IJO_1415_22", "studyType": "回溯性病例系列 (單一中心、單一醫師）", "n": "35 眼 (33 眼完成追蹤）", "tags": ["假性脫皮", "懸韌帶無力", "睫狀溝", "Optic capture", "三片式 IOL"], "conclusion": "假性脫皮合併輕到中度懸韌帶無力的患者，把三片式 IOL 放在睫狀溝並將光學區嵌入前囊口 (Optic capture），平均追蹤 2 年 3 個月沒有發生 IOL 晚期脫位。", "about": "印度單一中心回溯 2017–2022 年 35 位假性脫屑 (exfoliation) 患者，皆有直接或間接的懸韌帶無力證據 (例如水晶體晃動、小瞳孔、褐色核、前房淺）。由同一位醫師以 5–5.25 mm 前囊造口完成乳化後，把三片式疏水性壓克力 IOL 的 haptic 放在睫狀溝，再把光學區推入前囊口後方形成 optic capture；度數與囊袋內 IOL 相同。17 眼使用囊袋張力環(CTR），15 眼使用虹膜勾擴瞳。", "keyResults": ["35 眼中 2 眼失聯，33 眼納入分析；平均年齡 75.2 歲，平均追蹤 2 年 3 個月（4 個月至 5 年）", "CDVA (logMAR) 由術前 1.40 ± 0.92 改善至術後 1 個月 0.38 ± 0.26", "眼壓由術前 15.27 ± 3.89 mmHg 變為術後 1 個月 13.54 ± 4.21 mmHg", "追蹤期間無 IOL 晚期半脫位或脫位，也沒有 PCO、前囊口收縮、明顯色素播散或葡萄膜炎", "術後第 1 天 5 眼出現 Descemet 膜皺褶，皆以保守治療改善；無前囊袋膨脹症候群（capsular distension syndrome）"], "clinical": "對假性脫屑合併輕到中度懸韌帶無力的病例，「三片式 IOL 睫狀溝＋optic capture」是一個不需額外固定裝置的選項，可作為和囊袋張力環、鞏膜固定等方式比較時的參考。此為單一醫師的小型病例系列、沒有對照組，長期防止脫位的效果仍需更多研究確認。", "limitations": ["回溯性、無對照組，樣本小", "單一醫師執行，結果不一定能推廣到其他術者", "術後視力只報告 1 個月的數據，追蹤時間長短不一（部分僅 4 個月）"], "authorsView": "作者認為，haptic 放在睫狀溝提供主要支撐，可減少對已經無力的懸韌帶的依賴；optic capture 則讓 IOL 置中、避免光學區與虹膜接觸，也能防止瞳孔阻滯，度數可沿用囊袋內 IOL 的計算。作者建議：輕到中度懸韌帶無力時，這是理想的做法；嚴重懸韌帶病變則需加上虹膜縫合、鞏膜固定或 Cionni ring 等固定方式；沒有明顯懸韌帶病變、年紀相對較輕（50–60 多歲）的假性脫屑患者，也可考慮此法以預防日後囊袋內 IOL 脫位。", "titleZh": "假性脫皮症候群懸韌帶輕中度無力：三片式 IOL 睫狀溝植入合併 optic capture", "mustRead": false, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T06:11:14.449Z", "liveFigures": [{"addedAt": "2026-11-11T06:10:56.788Z", "alt": "3-Piece IOL 採用Optical capture方法", "assetId": "4e27ba6a806c5d06a33c333b75d40e4a", "caption": "", "fid": "fmwbq0as4", "kind": "image", "source": "原文 Figure 3（Bhaskaran J et al., Indian J Ophthalmol. 2022;70:4312–4318）", "title": "3-Piece IOL 採用Optical capture方法"}], "liveOrder": ["fmwbq0as4"]}, {"id": "pf2d93b2d", "cat": "04", "sub": "02", "year": 2009, "title": "Complications of sulcus placement of single-piece acrylic intraocular lenses: Recommendations for backup IOL implantation following posterior capsule rupture", "authors": "Chang DF, Masket S, Miller KM, Braga-Mele R, Little BC, Mamalis N, Oetting TA, Packer M; ASCRS Cataract Clinical Committee", "journal": "Journal of Cataract & Refractive Surgery", "citation": "J Cataract Refract Surg. 2009;35:1445–1458", "doi": "10.1016/j.jcrs.2009.04.027", "studyType": "專題報告（回溯性病例系列＋文獻回顧）", "n": "30 位患者（30 眼）", "tags": ["睫狀溝", "單片式壓克力 IOL", "UGH 症候群", "備用 IOL", "ASCRS"], "conclusion": "設計為囊袋中使用的 IOL (如單片式壓克力 IOL) 不應放在睫狀溝；每台白內障手術都應備有合適度數、尺寸與設計的備用 IOL。", "about": "ASCRS 白內障臨床委員會 6 位成員回顧 2006–2008 年轉診到其診所、因單片式壓克力 (SPA) IOL 放在睫狀溝而出現併發症的 30 位患者，記錄臨床表現與處置結果，並回顧文獻，整理後囊破裂時備用 IOL 的設計、尺寸與度數建議。這些都是轉診個案，作者本身不在睫狀溝植入 SPA IOL。", "keyResults": ["30 眼中 29 眼為 AcrySof 單片式 IOL，1眼為 Rayner 570C", "併發症 (30 位）：色素播散 25、虹膜透照缺損 24、IOL 邊緣症狀 13、眼壓 > 22 mmHg 10、眼內出血 7、CME 4", "多數患者同時有多種併發症：1 種 2 位、2 種 8 位、3 種 13 位、4 種 4 位、5 種 2 位", "28 眼 (93%) 需要手術處置，其中 25 眼 (83%) 更換 IOL；處置後 17 眼 CDVA 達 20/20", "作者的睫狀溝 IOL 建議：選三片式、haptic 向後傾斜、光學區前緣圓滑；沒有光學區夾持時，選最長的三片式摺疊 IOL，光學區至少 6.0 mm，不建議總長短於 13.0 mm", "度數建議：  Lens Implantation In The Ciliary Sulcus: Challenges And Risks", "authors": "Mehta R, Aref AA", "journal": "Clinical Ophthalmology", "citation": "Clin Ophthalmol. 2019;13:2317–2323", "doi": "10.2147/OPTH.S205148", "tags": ["睫狀溝", "三片式 IOL", "度數調整", "Optic capture", "單片式壓克力 IOL"], "titleZh": "睫狀溝 IOL 植入的挑戰與風險：綜述"}, {"id": "p1ad8816d", "cat": "04", "sub": "03", "year": 2020, "title": "Intraocular Lens Implantation in the Absence of Zonular Support: An Outcomes and Safety Update. A Report by the American Academy of Ophthalmology", "authors": "Shen JF, Deng S, Hammersmith KM, Kuo AN, Li JY, Weikert MP, Shtein RM", "journal": "Ophthalmology", "citation": "Ophthalmology. 2020;127:1234–1258", "doi": "10.1016/j.ophtha.2020.03.005", "studyType": "AAO 眼科技術評估 (文獻回顧)", "n": "45 篇研究 (level II 3 篇、level III 42 篇）", "tags": ["無懸韌帶支撐", "ACIOL", "虹膜固定式 IOL", "鞏膜縫合", "ISHF", "AAO"], "conclusion": "無懸韌帶支撐時，現有證據顯示沒有任何一種 IOL 植入技術明顯優於其他；各技術的視力結果相近，但各有不同的併發症型態。", "about": "美國眼科醫學會 (AAO) 的眼科技術評估 (OTA），更新 2003 年的版本。檢索 PubMed 與 Cochrane (至 2019 年 7 月）共 734 篇，納入 45 篇追蹤至少 6 個月的研究，比較 8 種技術：前房 IOL (ACIOL)、虹膜固定式 IOL、後置虹膜固定式 IOL、10-0 聚丙烯虹膜縫合 PCIOL、10-0 與 8-0 聚丙烯鞏膜縫合 PCIOL、CV-8 Gore-Tex 鞏膜縫合 PCIOL，以及鞏膜內 haptic 固定（ISHF，含 Yamane 術式）。各技術的視力與併發症以加權平均整理。", "keyResults": ["45 篇研究的統計檢定力不足以明確比較各技術；質性分析顯示各技術的視力結果不劣於 ACIOL", "CME：10-0 虹膜縫合 PCIOL 16.2%、8-0 鞏膜縫合 13.2%，ACIOL 7.3%；ISHF 4.5%", "慢性葡萄膜炎以 ACIOL 比例最高 (5.6%），非前房的技術較少", "慢性青光眼以 8-0 鞏膜縫合最高 (13.2%)；ACIOL 6.8% 與 10-0 鞏膜縫合 5.5% 相近", "除 CV-8 外，縫合式 PCIOL 的視網膜剝離比例約為非縫合方式的 2–3 倍", "瞳孔夾持（pupillary capture）以 ISHF 最高（3.5%）", "8-0 鞏膜縫合研究中，縫合比植入 ACIOL 多花 45–70 分鐘"], "clinical": "這是美國眼科醫學會的官方技術評估，適合用來了解各種無囊袋支撐 IOL 技術的併發症型態。表中的加權平均來自病例系列，且未控制病人條件，宜視為各技術的風險傾向，而不是直接比較優劣的依據。原文也提到，2020 年時虹膜固定式 IOL 在美國尚未取得無水晶體的適應症，各國法規不同。", "limitations": ["納入研究多為回溯性病例系列 (42 篇為 level III），未控制術前病況嚴重度", "未報告的併發症以 0 計算，實際比例可能被低估", "各技術病例數差異大，例如 8-0 聚丙烯僅 30 眼、CV-8 僅 85 眼", "文獻檢索至 2019 年 7 月，之後發表的研究未納入"], "authorsView": "作者認為現有證據顯示沒有單一技術優於其他，各技術的視力結果與安全性大致相當，但各有其固有的術後併發症風險。虹膜完整時，可在 8 種技術中選擇；由於 10-0 聚丙烯已知會隨時間降解，較粗的縫線理論上可能減少晚期脫位，但仍需更長期的研究證實。作者強調應讓病人了解長期密切追蹤的重要，並呼籲進行大型前瞻性研究。", "figures": [{"kind": "table", "title": "8 種技術的主要併發症（加權平均 %）", "columns": ["技術", "眼數", "CME", "慢性青光眼", "慢性葡萄膜炎", "視網膜剝離"], "rows": [["前房 IOL（angle-supported）", "311", "7.3", "6.8", "5.6", "0.9"], ["虹膜固定式 IOL（前房）", "254", "4.2", "0.4", "3.5", "0.4"], ["後置虹膜固定式 IOL", "629", "2.8", "1.2", "1.0", "0.7"], ["10-0 聚丙烯虹膜縫合 PCIOL", "639", "16.2", "2.0", "0.2", "2.0"], ["10-0 聚丙烯鞏膜縫合 PCIOL", "1163", "4.8", "5.5", "2.0", "2.2"], ["8-0 聚丙烯鞏膜縫合 PCIOL", "30", "13.2", "13.2", "0", "3.3"], ["CV-8 Gore-Tex 鞏膜縫合 PCIOL", "85", "2", "未報告", "0", "0"], ["鞏膜內 haptic 固定（ISHF）", "1331", "4.5", "0.2", "0.3", "0.5"]], "caption": "未報告的併發症在原文以 0 計算，可能低估；病例條件未控制，不宜直接比較技術優劣。", "source": "整理自原文 Table 4（Shen et al., Ophthalmology 2020）"}, {"kind": "bar", "title": "視網膜剝離比例：縫合式與非縫合式", "labels": ["前房 IOL", "虹膜固定式 IOL（前房）", "後置虹膜固定式 IOL", "ISHF", "10-0 虹膜縫合 PCIOL", "10-0 鞏膜縫合 PCIOL", "8-0 鞏膜縫合 PCIOL", "CV-8 Gore-Tex 縫合"], "series": [{"name": "視網膜剝離", "values": [0.9, 0.4, 0.7, 0.5, 2.0, 2.2, 3.3, 0]}], "unit": "%", "caption": "AAO 跨研究彙整顯示：除 CV-8 PTFE 外，縫合式 PCIOL 系列的加權平均 RD 比例（2.0–3.3%）高於非縫合系列（0–0.9%）；此為跨研究趨勢，並非控制條件下的直接比較。", "source": "依原文 Table 4 數據重繪（Shen et al., Ophthalmology 2020）"}], "titleZh": "無懸韌帶支撐時的 IOL 植入：AAO 技術評估報告", "mustRead": true, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T09:00:39.115Z", "liveOrder": ["b0", "b1"], "liveEdits": {"b0": {"caption": "未報告的併發症在原文以 0 計算，可能低估；病例條件未控制，不宜直接比較技術優劣。", "columns": ["技術", "眼數", "CME", "慢性青光眼", "慢性葡萄膜炎", "視網膜剝離"], "editedAt": "2026-11-11T08:57:39.799Z", "rows": [["前房 IOL (angle-supported）", "311", "7.3", "6.8", "5.6", "0.9"], ["虹膜固定式 IOL（前房）", "254", "4.2", "0.4", "3.5", "0.4"], ["後置虹膜固定式 IOL", "629", "2.8", "1.2", "1.0", "0.7"], ["10-0 聚丙烯虹膜縫合 PCIOL", "639", "16.2", "2.0", "0.2", "2.0"], ["10-0 聚丙烯鞏膜縫合 PCIOL", "1163", "4.8", "5.5", "2.0", "2.2"], ["8-0 聚丙烯鞏膜縫合 PCIOL", "30", "13.2", "13.2", "0", "3.3"], ["CV-8 Gore-Tex 鞏膜縫合 PCIOL", "85", "2", "未 ama-Inoue M, Kadonosono K", "journal": "Ophthalmology", "citation": "Ophthalmology. 2017", "doi": "10.1016/j.ophtha.2017.03.036", "studyType": "前瞻性非對照病例系列", "n": "100 眼（97 位患者）", "tags": ["Yamane", "原始術式", "Flange", "Kowa PN6A"], "conclusion": "Yamane 雙針 flange 鞏膜內固定是簡單、微創且固定牢靠的二次 IOL 植入方法。", "about": "這是 Yamane 雙針 flange 鞏膜內固定的原始文獻。橫濱市立大學前瞻性追蹤 100 眼，用兩支 30G 薄壁針把三片式 IOL 的 haptic 拉出眼外，燒灼末端形成 flange 後推回鞏膜隧道，不需縫線就能固定 IOL。", "keyResults": ["BCVA 從術前 0.25 logMAR 改善至 6、12、24、36 個月的 0.11、0.09、0.12、0.04 logMAR", "平均 IOL 傾斜 3.4° ± 2.5°", "併發症：Iris Capture 8%、玻璃體出血 5%、CME 1%；無視網膜剝離、眼內炎或 IOL 脫位", "Iris Capture：7 mm 光學區 IOL (X-70) 2.0%，6 mm 光學區 IOL (ZA9003、PN6A、MA60MA）14.0% (P = 0.06）"], "clinical": "IOL 置中良好、平均傾斜 3.4°，視力顯著改善，36 個月內沒有視網膜剝離、眼內炎或 IOL 脫位。主要併發症是 Iris Capture (8%)，6mm 光學區 IOL 比 7mm 多 (14% vs 2%，未達統計顯著)。", "limitations": ["無對照組", "後期追蹤人數逐漸減少"], "authorsView": "作者認為，flange 鞏膜內固定是簡單、微創的技術，haptic 固定牢靠。", "figures": [{"kind": "line", "title": "Yamane 術後的 BCVA 變化（logMAR，數值越低越好）", "labels": ["術前", "6 個月", "12 個月", "24 個月", "36 個月"], "series": [{"name": "平均 BCVA", "values": [0.25, 0.11, 0.09, 0.12, 0.04]}], "decimals": 2, "lowerBetter": true, "min": 0, "caption": "6、12、24 個月皆顯著優於術前（P < 0.01）；36 個月與術前的差異未達統計顯著（P = 0.17）。", "source": "依原文 Abstract 與 Results 數據重繪（Yamane et al., Ophthalmology 2017）"}, {"kind": "bar", "title": "虹膜夾持（iris capture）比例：依 IOL 光學區大小", "labels": ["7 mm 光學區（X-70）", "6 mm 光學區（ZA9003、PN6A、MA60MA）"], "series": [{"name": "虹膜夾持", "values": [2.0, 14.0]}], "unit": "%", "caption": "6 mm 光學區 IOL 的虹膜夾持較多，但差異未達統計顯著（P = 0.06）。", "source": "依原文 Results 數據重繪（Yamane et al., Ophthalmology 2017）"}], "titleZh": "Yamane 原始術式：雙針 flange 鞏膜內 IOL 固定", "mustRead": true, "url": "", "reviewed": true, "locked": true, "reviewedAt": "2026-11-11T03:27:08.352Z", "liveFigures": [{"addedAt": "2026-11-11T01:47:42.110Z", "alt": "術後3個月影像", "assetId": "a6959206d404ef806e8f18ec4d2ea7ac", "caption": "A, 裂隙燈下觀察並未有明顯疤痕或是發炎反應. B, OCT 影像 IOL 呈現無偏移或傾斜. C, 人工水晶體 Haptic 的凸緣 (箭頭) 固定在鞏膜 (通道) 中，OCT 影像 const PAGE = 6;
function paperGrid(list, key) {
  if (!list.length) return '<div class="empty">這個主題目前還沒有文獻。</div>';
  const must = list.filter(p => p.mustRead), rest = list.filter(p => !p.mustRead);
  const open = state.showAll === key, shown = open ? rest : rest.slice(0, PAGE);
  const mustSec = must.length ? `<section class="psec"><div class="psec-head"><h3>建議先讀<small>${must.length} 篇，掌握這個主題的核心</small></h3></div><div class="pgrid">${must.map((p, i) => pcard(p, i + 1)).join("")}</div></section>` : "";
  const restSec = rest.length ? `<section class="psec"><div class="psec-head"><h3>${must.length ? "延伸閱讀" : "文獻"}<small>${rest.length} 篇${must.length ? "，有興趣再深入" : ""}</small></h3></div><div class="pgrid">${shown.map(p => pcard(p)).join("")}</div>${rest.length > PAGE ? `<button class="btn more-btn" type="button" id="moreBtn">${open ? "收合" : `顯示其餘 ${rest.length - PAGE} 篇`}</button>` : ""}</section>` : "";
  return mustSec + restSec;
}

const READER = true;
const READER_URL = "https://posen-cataract.github.io/cataract-iol-insight/";
const SITE_URL = READER_URL; // share buttons always hand out the public reading site (the editing site is private)
const setHash = h => { try { history.replaceState(null, "", "#" + h); } catch {} };
const shareBtn = (label, hash) => `<span class="share"><button class="btn share-btn" type="button" data-share="${esc(hash)}">${label}</button><span class="share-out" role="status"></span></span>`;
function wireShare() {
  app.querySelectorAll("[data-share]").forEach(b => b.addEventListener("click", async () => {
    const url = SITE_URL + "#" + b.dataset.share, out = b.nextElementSibling;
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch {}
    out.innerHTML = ok ? `已複製連結，可直接貼到 LINE 或 Email` : `請長按或選取下方連結複製：<input class="share-url" readonly value="${esc(url)}" aria-label="分享連結">`;
    out.querySelector("input")?.select();
  }));
}

function category(cid) {
  hero(false);
  const c = catById(cid);
  if (!c) return home();
  let list = inCat(cid, state.sub).sort(byList);
  if (state.onlyDone) list = list.filter(has);
  if (state.onlyReviewed) list = list.filter(p => p.reviewed);
  if (state.onlyUnreviewed) list = list.filter(p => has(p) && !p.reviewed);
  const sub = c.subs.find(s => s.id === state.sub);
  const guide = sub ? guideBlock(c, sub) : overview(c);
  app.innerHTML = `
    <nav class="crumbs"><a href="#home">首頁</a><span>›</span><span>${esc(c.zh)}</span></nav>
    <section class="cat-title"><h1>${esc(c.zh)}</h1><p>${esc(c.en)}${sub ? ` · ${esc(sub.en)}${sub.zh ? `（${esc(sub.zh)}）` : ""}` : ""}</p>${shareBtn(sub ? "分享這個子主題" : "分享這個主題", "c" + cid + (sub ? "-" + sub.id : ""))}</section>
    <div class="tabs" role="group" aria-label="子主題">
      <button type="button" data-sub="" aria-pressed="${!state.sub}">全部<span>${inCat(cid).length}</span></button>
      ${c.subs.map(s => `<button type="button" data-sub="${s.id}" aria-pressed="${state.sub === s.id}">${esc(s.en)}<span>${inCat(cid, s.id).length}</span></button>`).join("")}
    </div>
    ${guide}
    <div class="toolbar"><span style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">共 ${list.length} 篇<span class="viewtog" role="group" aria-label="顯示方式"><button type="button" data-view="grid" aria-pressed="${getView() === "grid"}">方格</button><button type="button" data-view="list" aria-pressed="${getView() === "list"}">清單</button></span></span><span style="display:flex;gap:16px;flex-wrap:wrap"><label><input id="onlyrev" type="checkbox" ${state.onlyReviewed ? "checked" : ""}> 只看經作者校閱（${inCat(cid, state.sub).filter(p => p.reviewed).length}）</label><label><input id="only" type="checkbox" ${state.onlyDone ? "checked" : ""}> 只看已有中文摘要</label>${state.isOwner ? `<label><input id="unrev" type="checkbox" ${state.onlyUnreviewed ? "checked" : ""}> 只看待校閱（${inCat(cid, state.sub).filter(p => has(p) && !p.reviewed).length}）</label>` : ""}</span></div>
    ${getView() === "grid" ? paperGrid(list, cid + "-" + (state.sub || "")) : `<div class="list">${list.length ? list.map(item).join("") : '<div class="empty">這個主題目前還沒有文獻。</div>'}</div>`}`;
  app.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { setView(b.dataset.view); category(cid); }));
  app.querySelector("#moreBtn")?.addEventListener("click", () => { const k = cid + "-" + (state.sub || ""); state.showAll = state.showAll === k ? null : k; category(cid); });
  wireShare();
  app.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { state.sub = b.dataset.sub || null; state.editingIntro = null; setHash("c" + cid + (state.sub ? "-" + state.sub : "")); category(cid); }));
  app.querySelector("#only").addEventListener("change", e => { state.onlyDone = e.target.checked; category(cid); });
  app.querySelector("#onlyrev").addEventListener("change", e => { state.onlyReviewed = e.target.checked; category(cid); });
  app.querySelector("#unrev")?.addEventListener("change", e => { state.onlyUnreviewed = e.target.checked; category(cid); });
  app.querySelectorAll("[data-go-sub]").forEach(b => b.addEventListener("click", () => { state.sub = b.dataset.goSub; setHash("c" + cid + "-" + state.sub); category(cid); window.scrollTo(0, 0); }));
  if (sub) wireGuide(c, sub);
}

function overview(c) {
  const subs = c.subs.filter(s => inCat(c.id, s.id).length && introOf(c, s).intro);
  if (!subs.length) return "";
  return `<section class="overview">${subs.map(s => {
    const it = introOf(c, s), first = it.intro.split("。")[0] + "。";
    return `<button type="button" class="ov" data-go-sub="${s.id}"><b>${esc(s.en)}</b><span>${esc(first)}</span><small>${inCat(c.id, s.id).length} 篇 · 看導讀與必讀 →</small></button>`;
  }).join("")}</section>`;
}

function guideBlock(c, s) {
  const key = `${c.id}-${s.id}`, it = introOf(c, s);
  if (state.editingIntro === key) {
    return `<section class="guide"><h2>編輯主題導讀</h2>
      <div class="editor">
        <div class="field"><label for="g-intro">導讀內容</label><textarea id="g-intro" rows="5">${esc(it.intro)}</textarea></div>
        <div class="field"><label for="g-terms">關鍵名詞 <span class="hint">一行一個，格式「名詞：解釋」</span></label><textarea id="g-terms" rows="4">${esc(it.terms.join("\n"))}</textarea></div>
        <div class="actions"><button class="btn primary" type="button" id="g-save">儲存</button><button class="btn" type="button" id="g-cancel">取消</button>${it.edited ? '<button class="btn ghost-danger" type="button" id="g-revert">還原成原始版本</button>' : ""}<span class="status" id="g-status" role="status"></span></div>
      </div></section>`;
  }
  if (!it.intro && !state.isOwner) return "";
  const must = inCat(c.id, s.id).filter(p => p.mustRead).sort(byMust);
  return `<section class="guide">
    <div class="guide-head"><h2>主題導讀</h2>${state.isOwner ? '<button class="btn" type="button" id="g-edit">編輯導讀</button>' : ""}</div>
    ${it.intro ? `<p class="g-intro">${esc(it.intro)}</p><button type="button" class="g-more" id="g-more">展開完整導讀</button>` : '<p class="hint">這個子主題還沒有導讀。</p>'}
    ${it.terms.length ? `<details class="terms-fold"><summary>名詞解釋（${it.terms.length}）</summary><dl class="terms">${it.terms.map(t => { const [k, ...v] = t.split(/[:：]/); return `<div><dt>${esc(k.trim())}</dt><dd>${esc(v.join("：").trim())}</dd></div>`; }).join("")}</dl></details>` : ""}
    ${must.length && getView() !== "grid" ? `<div class="must-list"><h3>建議先讀</h3><ol>${must.map(p => `<li>${isLocked(p) ? `<span class="locked-txt">${esc(p.titleZh || p.title)}（校稿中）</span>` : `<a href="#${p.id}">${esc(p.titleZh || p.title)}</a>`} <span>${p.year ?? ""}</span></li>`).join("")}</ol></div>` : ""}
  </section>`;
}

function wireGuide(c, s) {
  const key = `${c.id}-${s.id}`;
  const gi = app.querySelector(".g-intro"), gm = app.querySelector("#g-more");
  if (gi && gm) { if (gi.scrollHeight <= gi.clientHeight + 2) gm.hidden = true; gm.addEventListener("click", () => { gi.classList.toggle("open"); gm.textContent = gi.classList.contains("open") ? "收合導讀" : "展開完整導讀"; }); }
  app.querySelector("#g-edit")?.addEventListener("click", () => { state.editingIntro = key; category(c.id); });
  app.querySelector("#g-cancel")?.addEventListener("click", () => { state.editingIntro = null; category(c.id); });
  const status = app.querySelector("#g-status");
  const say = (t, err) => { status.textContent = t; status.classList.toggle("err", !!err); };
  app.querySelector("#g-save")?.addEventListener("click", async e => {
    if (!state.db) return say("目前連不到資料庫，無法儲存。請重新整理頁面後再試。", true);
    const body = { intro: app.querySelector("#g-intro").value.trim(), terms: app.querySelector("#g-terms").value.split("\n").map(x => x.trim()).filter(Boolean), updatedAt: new Date().toISOString() };
    e.target.disabled = true; say("儲存中…");
    try { await state.db.collection("intros").doc(key).set(body); state.intros[key] = body; state.editingIntro = null; category(c.id); }
    catch (err) { e.target.disabled = false; say(err?.code === "invalid_argument" ? "沒有儲存權限，只有網站擁有者可以修改。" : "儲存失敗，請稍後再按一次儲存。", true); }
  });
  app.querySelector("#g-revert")?.addEventListener("click", async e => {
    e.target.disabled = true; say("還原中…");
    try { await state.db.collection("intros").doc(key).delete(); delete state.intros[key]; state.editingIntro = null; category(c.id); }
    catch { e.target.disabled = false; say("還原失敗，請稍後再試。", true); }
  });
}

const isUrl = v => /^https?:\/\//i.test(v || "");
const cleanDoi = v => (v || "").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").replace(/^doi:\s*/i, "");
// Where "閱讀原文" goes: an explicit URL wins, then DOI; a URL typed into the DOI box is treated as a URL.
function origin(p) {
  const doi = cleanDoi(p.doi);
  if (isUrl(p.url)) return { href: p.url, note: hostOf(p.url) };
  if (isUrl(doi)) return { href: doi, note: hostOf(doi) };
  if (doi) return { href: `https://doi.org/${encodeURI(doi)}`, note: `DOI: ${doi}` };
  return null;
}
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };

const listHtml = a => (a || []).length ? `<ul>${a.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : "";
const para = t => t ? `<p>${esc(t)}</p>` : "";
// Collapsible blocks (phone, tablet and desktop alike). Background blocks start folded; readers open what they need.
const fold = (id, title, body, startClosed) => `<details class="fold" id="${id}"${startClosed ? "" : " open"}><summary><h4>${title}</h4><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">${body}</div></details>`;
const openTo = el => { for (let d = el.closest("details"); d; d = d.parentElement?.closest("details")) d.open = true; };
// Three evidence layers, from what the paper measured to what may follow for practice.
// Older fields (design/application) are read as fallbacks for summaries saved before this structure.
function layers(p) {
  const L = [
    ["evidence", "1", "文獻實際結果", "Evidence", "研究做了什麼、量到什麼數據。只寫原文中的事實與數字。",
      `${(p.about || p.design) ? fold("s-design", "研究設計", para(p.about || p.design), true) : ""}${(p.keyResults || []).length ? fold("s-data", "主要數據", listHtml(p.keyResults)) : ""}${figuresBlock(p)}${(p.limitations || []).length ? fold("s-limits", "研究限制", listHtml(p.limitations), true) : ""}`],
    ["authors", "2", "作者解釋", "Authors' Interpretation", "原文作者自己的結論與建議。",
      para(p.authorsView)],
    ["implication", "3", "臨床實務推論", "Clinical Implication", "根據前兩層做的保守推論，不是原文的直接結論。",
      para(p.clinical || p.application)],
  ];
  return L.filter(l => l[5]).map(([cls, n, zh, en, note, body]) => `<details class="layer ${cls}" id="s-${cls}" open>
    <summary class="layer-head"><span class="ln">${n}</span><div class="lh-text"><h2>${zh}<small>${en}</small></h2><p>${note}</p></div><span class="chev" aria-hidden="true"></span></summary>
    <div class="layer-body">${body}</div></details>`).join("");
}

function sourceLink(p) {
  const patent = /^([A-Z]{2}\d{6,}[A-Z]\d?)/.exec(p.title);
  const o = origin(p);
  if (o) return `<a class="btn primary" href="${esc(o.href)}" target="_blank" rel="noopener">閱讀原文</a>`;
  if (patent) return `<a class="btn primary" href="https://patents.google.com/patent/${patent[1]}" target="_blank" rel="noopener">在 Google Patents 查看專利</a>`;
  if (/SSED/.test(p.title)) return `<a class="btn" href="https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpma/pma.cfm" target="_blank" rel="noopener">FDA PMA 資料庫</a>`;
  return `<a class="btn" href="https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(p.title)}" target="_blank" rel="noopener">在 PubMed 搜尋原文</a>`;
}


// ---- Figures: charts redrawn from reported numbers, tables, or uploaded images ----
const FIG_COLORS = ["var(--accent)", "var(--gold)", "var(--muted)"];
const fmtN = v => (Math.round(v * 100) / 100).toString();
const FIG_KIND = { bar: "依原文數據重繪", line: "依原文數據重繪", table: "原文表格整理", image: "原文圖片" };
function barFig(fg) {
  const series = fg.series || [];
  const vals = series.flatMap(s => s.values).filter(v => typeof v === "number");
  const max = fg.max || Math.max(...vals, 0) || 1;
  const unit = fg.unit || "";
  const rows = (fg.labels || []).map((l, i) => `<div class="fb-row"><div class="fb-label">${esc(l)}</div><div class="fb-bars">${series.map((s, k) => {
    const v = s.values[i];
    return typeof v === "number" ? `<div class="fb-track"><div class="fb-fill" style="width:calc(${(v / max) * 100}% - 60px * ${v / max});background:${FIG_COLORS[k % 3]}"></div><span class="fb-val">${fg.decimals != null ? v.toFixed(fg.decimals) : fmtN(v)}${esc(unit)}</span></div>` : `<div class="fb-track"><span class="fb-na">未報告</span></div>`;
  }).join("")}</div></div>`).join("");
  return `<div class="fb" role="img" aria-label="${esc(fg.title || "")}">${rows}</div>${legend(series)}`;
}
const legend = series => series.length > 1 ? `<div class="fig-legend">${series.map((s, k) => `<span><i style="background:${FIG_COLORS[k % 3]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
function lineFig(fg) {
  const W = 640, H = 240, L = 44, R = 16, T = 22, B = 34;
  const labels = fg.labels || [], series = fg.series || [];
  const vals = series.flatMap(s => s.values).filter(v => typeof v === "number");
  const dmin = Math.min(...vals), dmax = Math.max(...vals);
  const raw = (dmax - dmin) / 4 || 1, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const lo = fg.min ?? Math.max(0, Math.floor(dmin / step) * step - (dmin % step === 0 ? step : 0)), hi = fg.max ?? Math.ceil(dmax / step) * step + (dmax % step === 0 ? step : 0);
  const PADX = 26;
  const x = i => L + PADX + (labels.length < 2 ? 0 : (i * (W - L - R - 2 * PADX)) / (labels.length - 1));
  const y = v => T + ((hi - v) / (hi - lo)) * (H - T - B);
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtN(v)}</text>`).join("");
  const dv = v => fg.decimals != null ? v.toFixed(fg.decimals) : fmtN(v);
  const xl = labels.map((l, i) => `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(l)}</text>`).join("");
  const lines = series.map((s, k) => {
    const pts = s.values.map((v, i) => typeof v === "number" ? [x(i), y(v), v] : null).filter(Boolean);
    return `<polyline fill="none" stroke="${FIG_COLORS[k % 3]}" stroke-width="2.5" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>` +
      pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="${FIG_COLORS[k % 3]}" stroke-width="2"/><text class="v" x="${p[0]}" y="${p[1] - 9}" text-anchor="middle">${dv(p[2])}</text>`).join("");
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(fg.title || "")}">${grid}${xl}${lines}</svg>${legend(series)}${fg.lowerBetter ? '<p class="fig-note">縱軸數值越低代表結果越好。</p>' : ""}`;
}
function tableFig(fg) {
  return `<div class="fig-table"><table><thead><tr>${(fg.columns || []).map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${(fg.rows || []).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const imgSrc = fg => fg.assetId ? (READER ? "img/" + fg.assetId + ".png" : "/_blob/" + fg.assetId) : fg.src || "";
function figHtml(fg, idx, own, move, bkey) {

        <div style="display:flex;gap:20px;flex-wrap:wrap"><label class="check"><input type="checkbox" id="f-must" ${p.mustRead ? "checked" : ""}> 設為這個子主題的必讀文章</label></div>
        ${f("conclusion", "一句話重點", p.conclusion, { big: true, rows: 2 })}
        <div class="row2">${f("studyType", "研究類型", p.studyType, { input: true })}${f("n", "樣本數", p.n, { input: true })}</div>
        <div class="row2">${f("authors", "作者", p.authors, { input: true })}${f("journal", "期刊", p.journal, { input: true })}</div>
        <div class="row2">${f("citation", "引用格式", p.citation, { input: true })}${f("doi", "DOI", cleanDoi(p.doi), { input: true, hint: "只填號碼，例如 10.1097/…" })}</div>
        ${f("url", "原文網址", p.url || (isUrl(cleanDoi(p.doi)) ? cleanDoi(p.doi) : ""), { input: true, hint: "沒有 DOI 時填，例如學會網頁、CRST、EyeNet 文章；有填時優先使用" })}
        ${f("tags", "標籤", (p.tags || []).join("、"), { input: true, hint: "用頓號或逗號分隔" })}
        <h3 class="ed-layer">1 · 文獻實際結果（Evidence）<span>只寫原文的事實與數字</span></h3>
        ${f("about", "研究設計", p.about || p.design, { rows: 4 })}
        ${f("keyResults", "主要數據", lines(p.keyResults), { rows: 6, hint: "一行一點，保留原始數字" })}
        ${f("limitations", "研究限制", lines(p.limitations), { rows: 4, hint: "一行一點" })}
        <h3 class="ed-layer">2 · 作者解釋（Authors' Interpretation）<span>原文作者的結論與建議</span></h3>
        ${f("authorsView", "作者解釋", p.authorsView, { rows: 4 })}
        <h3 class="ed-layer">3 · 臨床實務推論（Clinical Implication）<span>保守推論，避免超出原文</span></h3>
        ${f("clinical", "臨床實務推論", p.clinical || p.application, { rows: 4 })}
        <div class="actions">
          <button class="btn primary" type="submit" id="save">儲存</button>
          <button class="btn" type="button" id="cancel">取消</button>
          ${state.overrides[p.id] ? '<button class="btn ghost-danger" type="button" id="revert">還原成原始版本</button>' : ""}
          <span class="status" id="status" role="status"></span>
        </div>
      </form>
    </article>`;
  const status = app.querySelector("#status");
  const say = (t, err) => { status.textContent = t; status.classList.toggle("err", !!err); };
  const split = v => v.split("\n").map(x => x.trim()).filter(Boolean);
  const val = id => app.querySelector(`#f-${id}`).value.trim();
  const done = () => { state.editing = null; paper(p.id); };
  app.querySelector("#cancel").addEventListener("click", done);
  app.querySelector("#form").addEventListener("submit", async e => {
    e.preventDefault();
    if (!state.db) return say("目前連不到資料庫，無法儲存。請重新整理頁面後再試。", true);
    const body = {
      titleZh: val("titleZh") || p.titleZh,
      mustRead: app.querySelector("#f-must").checked,
      authors: val("authors"), journal: val("journal"), citation: val("citation"), doi: isUrl(cleanDoi(val("doi"))) ? "" : cleanDoi(val("doi")), url: val("url") || (isUrl(cleanDoi(val("doi"))) ? cleanDoi(val("doi")) : ""),
      studyType: val("studyType"), n: val("n"), tags: val("tags").split(/[、,，]/).map(t => t.trim()).filter(Boolean),
      conclusion: val("conclusion"), about: val("about"), keyResults: split(val("keyResults")),
      limitations: split(val("limitations")), authorsView: val("authorsView"), clinical: val("clinical"),
      updatedAt: new Date().toISOString(),
    };
    const btn = app.querySelector("#save"); btn.disabled = true; say("儲存中…");
    try {
      await state.db.collection("summaries").doc(p.id).set(body);
      state.overrides[p.id] = body; done();
    } catch (err) {
      btn.disabled = false;
      say(err?.code === "invalid_argument" ? "沒有儲存權限，只有網站擁有者可以修改。" : err?.code === "quota_exceeded" ? "資料庫空間已滿，無法再新增。" : "儲存失敗，請稍後再按一次儲存。", true);
    }
  });
  app.querySelector("#revert")?.addEventListener("click", async () => {
    const btn = app.querySelector("#revert"); btn.disabled = true; say("還原中…");
    try { await state.db.collection("summaries").doc(p.id).delete(); delete state.overrides[p.id]; done(); }
    catch { btn.disabled = false; say("還原失敗，請稍後再試。", true); }
  });
}

function search(term) {
  hero(false);
  q2.value = term;
  if (document.activeElement !== q2) { q2.focus(); q2.setSelectionRange(term.length, term.length); }
  const t = term.toLowerCase();
  const hay = p => [p.titleZh, p.title, state.priv[p.id]?.label, p.authors, p.journal, (p.tags || []).join(" "), p.conclusion, p.about || p.design, (p.keyResults || []).join(" "), p.clinical || p.application, p.authorsView].join(" ").toLowerCase();
  const list = all().filter(p => hay(p).includes(t)).sort(byYear);
  app.innerHTML = `
    <nav class="crumbs"><a href="#home">首頁</a><span>›</span><span>搜尋</span></nav>
    <div class="sec-head"><h2>「${esc(term)}」找到 ${list.length} 篇</h2></div>
    <div class="list">${list.length ? list.map(item).join("") : '<div class="empty">沒有找到符合的文獻。可以換個關鍵字，或用英文試試，例如 Yamane、toric、PCO。</div>'}</div>`;
}

let lastCat = null;
function route() {
  const h = location.hash.slice(1) || "home";
  if (h !== state.editing) state.editing = null;
  if (h !== state.addingFig) { state.addingFig = null; state.figEdit = null; }
  if (h !== state.unlocking) state.unlocking = null;
  state.editingIntro = null;
  if (h === "search") return state.query.trim() ? search(state.query.trim()) : home();
  if (h.startsWith("c")) {
    const [cid, sid] = h.slice(1).split("-");
    state.sub = sid || null; // the hash always mirrors the open subtopic (tabs update it via replaceState)
    lastCat = cid; return category(cid);
  }
  if (h.startsWith("p")) return paper(h);
  return home();
}
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); route(); });
q2.addEventListener("input", () => { state.query = q2.value; if (q2.value.trim()) { if (location.hash !== "#search") location.hash = "#search"; else search(q2.value.trim()); } });
document.addEventListener("input", e => { if (e.target.id === "q" && location.hash === "#search") search(state.query.trim()); });
route();

// Live features: owner editing + shared summaries. The page works without them.
(async () => {
  if (READER || !window.claude?.use) return;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  state.isOwner = user ? Boolean(await user.isOwner()) : false;
  if (state.isOwner) document.getElementById("mode").innerHTML = '<span class="mode">編輯模式</span>';
  if (!db) { if (state.isOwner) route(); return; }
  state.db = db;
  db.collection("summaries").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.overrides = next;
    if (!state.editing && !state.editingIntro && !state.addingFig) route();
  }, () => {});
  if (state.isOwner) db.collection("private").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.priv = next;
    if (!state.editing && !state.editingIntro && !state.addingFig) route();
  }, () => {});
  db.collection("review").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.review = next; state.reviewLoaded = true;
    if (!state.editing && !state.editingIntro && !state.addingFig && !state.unlocking) route();
  }, () => {});
  db.collection("figures").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.figs = next; state.figsLoaded = true;
    if (!state.editing && !state.editingIntro && !state.addingFig) route();
  }, () => {});
  if (state.isOwner) claude.use("assets").then(a => { state.assets = a; if (state.addingFig) route(); }).catch(() => {});
  db.collection("intros").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.intros = next;
    if (!state.editing && !state.editingIntro && !state.addingFig) route();
  }, () => {});
  if (state.isOwner) route();
})();
</script>
</body>
</html>
