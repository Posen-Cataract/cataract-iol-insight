const isUrl = v => /^https?:\/\//i.test(v || "");
const cleanDoi = v => (v || "").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").replace(/^doi:\s*/i, "");
// Where "閱讀原文" goes: an explicit URL wins, then DOI; a URL typed into the DOI box is treated as a URL.
function origin(p) {
  const doi = cleanDoi(p.doi);
  if (isUrl(p.url)) return { href: p.url, note: hostOf(p.url) };
  if (isUrl(doi)) return { href: doi, note: hostOf(doi) };
  if (doi) return { href: `https://doi.org/${encodeURI(doi)}`, note: `DOI: ${doi}` };
  return null;
}
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };

const listHtml = a => (a || []).length ? `<ul>${a.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : "";
const para = t => t ? `<p>${esc(t)}</p>` : "";
// Collapsible blocks (phone, tablet and desktop alike). Background blocks start folded; readers open what they need.
const fold = (id, title, body, startClosed) => `<details class="fold" id="${id}"${startClosed ? "" : " open"}><summary><h4>${title}</h4><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">${body}</div></details>`;
const openTo = el => { for (let d = el.closest("details"); d; d = d.parentElement?.closest("details")) d.open = true; };
// Three evidence layers, from what the paper measured to what may follow for practice.
// Older fields (design/application) are read as fallbacks for summaries saved before this structure.
function layers(p) {
  const L = [
    ["evidence", "1", "文獻實際結果", "Evidence", "研究做了什麼、量到什麼數據。只寫原文中的事實與數字。",
      `${(p.about || p.design) ? fold("s-design", "研究設計", para(p.about || p.design), true) : ""}${(p.keyResults || []).length ? fold("s-data", "主要數據", listHtml(p.keyResults)) : ""}${figuresBlock(p)}${(p.limitations || []).length ? fold("s-limits", "研究限制", listHtml(p.limitations), true) : ""}`],
    ["authors", "2", "作者解釋", "Authors' Interpretation", "原文作者自己的結論與建議。",
      para(p.authorsView)],
    ["implication", "3", "臨床實務推論", "Clinical Implication", "根據前兩層做的保守推論，不是原文的直接結論。",
      para(p.clinical || p.application)],
  ];
  return L.filter(l => l[5]).map(([cls, n, zh, en, note, body]) => `<details class="layer ${cls}" id="s-${cls}" open>
    <summary class="layer-head"><span class="ln">${n}</span><div class="lh-text"><h2>${zh}<small>${en}</small></h2><p>${note}</p></div><span class="chev" aria-hidden="true"></span></summary>
    <div class="layer-body">${body}</div></details>`).join("");
}

function sourceLink(p) {
  const patent = /^([A-Z]{2}\d{6,}[A-Z]\d?)/.exec(p.title);
  const o = origin(p);
  if (o) return `<a class="btn primary" href="${esc(o.href)}" target="_blank" rel="noopener">閱讀原文</a>`;
  if (patent) return `<a class="btn primary" href="https://patents.google.com/patent/${patent[1]}" target="_blank" rel="noopener">在 Google Patents 查看專利</a>`;
  if (/SSED/.test(p.title)) return `<a class="btn" href="https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpma/pma.cfm" target="_blank" rel="noopener">FDA PMA 資料庫</a>`;
  return `<a class="btn" href="https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(p.title)}" target="_blank" rel="noopener">在 PubMed 搜尋原文</a>`;
}


// ---- Figures: charts redrawn from reported numbers, tables, or uploaded images ----
const FIG_COLORS = ["var(--accent)", "var(--gold)", "var(--muted)"];
const fmtN = v => (Math.round(v * 100) / 100).toString();
const FIG_KIND = { bar: "依原文數據重繪", line: "依原文數據重繪", table: "原文表格整理", image: "原文圖片" };
function barFig(fg) {
  const series = fg.series || [];
  const vals = series.flatMap(s => s.values).filter(v => typeof v === "number");
  const max = fg.max || Math.max(...vals, 0) || 1;
  const unit = fg.unit || "";
  const rows = (fg.labels || []).map((l, i) => `<div class="fb-row"><div class="fb-label">${esc(l)}</div><div class="fb-bars">${series.map((s, k) => {
    const v = s.values[i];
    return typeof v === "number" ? `<div class="fb-track"><div class="fb-fill" style="width:calc(${(v / max) * 100}% - 60px * ${v / max});background:${FIG_COLORS[k % 3]}"></div><span class="fb-val">${fg.decimals != null ? v.toFixed(fg.decimals) : fmtN(v)}${esc(unit)}</span></div>` : `<div class="fb-track"><span class="fb-na">未報告</span></div>`;
  }).join("")}</div></div>`).join("");
  return `<div class="fb" role="img" aria-label="${esc(fg.title || "")}">${rows}</div>${legend(series)}`;
}
const legend = series => series.length > 1 ? `<div class="fig-legend">${series.map((s, k) => `<span><i style="background:${FIG_COLORS[k % 3]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
function lineFig(fg) {
  const W = 640, H = 240, L = 44, R = 16, T = 22, B = 34;
  const labels = fg.labels || [], series = fg.series || [];
  const vals = series.flatMap(s => s.values).filter(v => typeof v === "number");
  const dmin = Math.min(...vals), dmax = Math.max(...vals);
  const raw = (dmax - dmin) / 4 || 1, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const lo = fg.min ?? Math.max(0, Math.floor(dmin / step) * step - (dmin % step === 0 ? step : 0)), hi = fg.max ?? Math.ceil(dmax / step) * step + (dmax % step === 0 ? step : 0);
  const PADX = 26;
  const x = i => L + PADX + (labels.length < 2 ? 0 : (i * (W - L - R - 2 * PADX)) / (labels.length - 1));
  const y = v => T + ((hi - v) / (hi - lo)) * (H - T - B);
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtN(v)}</text>`).join("");
  const dv = v => fg.decimals != null ? v.toFixed(fg.decimals) : fmtN(v);
  const xl = labels.map((l, i) => `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(l)}</text>`).join("");
  const lines = series.map((s, k) => {
    const pts = s.values.map((v, i) => typeof v === "number" ? [x(i), y(v), v] : null).filter(Boolean);
    return `<polyline fill="none" stroke="${FIG_COLORS[k % 3]}" stroke-width="2.5" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>` +
      pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="${FIG_COLORS[k % 3]}" stroke-width="2"/><text class="v" x="${p[0]}" y="${p[1] - 9}" text-anchor="middle">${dv(p[2])}</text>`).join("");
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(fg.title || "")}">${grid}${xl}${lines}</svg>${legend(series)}${fg.lowerBetter ? '<p class="fig-note">縱軸數值越低代表結果越好。</p>' : ""}`;
}
function tableFig(fg) {
  return `<div class="fig-table"><table><thead><tr>${(fg.columns || []).map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${(fg.rows || []).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const imgSrc = fg => fg.assetId ? (READER ? "img/" + fg.assetId + ".png" : "/_blob/" + fg.assetId) : fg.src || "";
function figHtml(fg, idx, own, move) {
  const body = fg.kind === "bar" ? barFig(fg) : fg.kind === "line" ? lineFig(fg) : fg.kind === "table" ? tableFig(fg)
    : fg.kind === "image" && fg.imgMissing ? `<p class="fig-ref">此為原文圖片，請見原文${state.figOrigin ? `（<a href="${esc(state.figOrigin)}" target="_blank" rel="noopener">查看原文</a>）` : ""}。</p>`
    : fg.kind === "image" && imgSrc(fg) ? `<button class="fig-zoom" type="button" data-zoom="${esc(imgSrc(fg))}" aria-label="放大圖片"><img src="${esc(imgSrc(fg))}" alt="${esc(fg.alt || fg.title || "")}" loading="lazy"></button><p class="fig-note">點圖片可放大</p>` : "";
  if (!body) return "";
  return `<figure class="fig" style="margin:0">
    <div class="fig-head"><h5>${esc(fg.title || "")}</h5><span class="fig-kind">${FIG_KIND[fg.kind] || ""}</span></div>
    ${body}
    ${fg.caption ? `<p class="fig-cap">${esc(fg.caption)}</p>` : ""}
    ${fg.source ? `<p class="fig-src${fg.kind === "image" ? " img-src" : ""}">資料來源：${esc(fg.source)}${fg.kind === "image" && state.figOrigin ? ` · <a href="${esc(state.figOrigin)}" target="_blank" rel="noopener">查看原文</a>` : ""}</p>` : ""}
    ${move || own ? `<div class="fig-tools">${move?.up ? `<button class="btn" type="button" data-figmove="${move.pos}" data-dir="-1" aria-label="往上移">↑ 上移</button>` : ""}${move?.down ? `<button class="btn" type="button" data-figmove="${move.pos}" data-dir="1" aria-label="往下移">↓ 下移</button>` : ""}${own ? `<button class="btn" type="button" data-figedit="${idx}">編輯</button><button class="btn ghost-danger" type="button" data-figdel="${idx}">刪除</button>` : ""}</div>` : ""}
  </figure>`;
}
const onlineFigs = pid => state.figsLoaded ? state.figs[pid]?.items || [] : DATA.papers.find(x => x.id === pid)?.liveFigures || [];
const figOrder = pid => (state.figsLoaded ? state.figs[pid]?.order : DATA.papers.find(x => x.id === pid)?.liveOrder) || [];
const figKey = (it, i) => it.fid || it.addedAt || "o" + i;
// One ordered list across built-in figures (b0, b1…) and uploaded ones; a saved order wins, unknown keys keep natural order.
function figEntries(p) {
  const list = [...(p.figures || []).map((fig, i) => ({ key: "b" + i, fig, online: false, idx: i })), ...onlineFigs(p.id).map((fig, i) => ({ key: figKey(fig, i), fig, online: true, idx: i }))];
  const order = figOrder(p.id), at = k => { const i = order.indexOf(k); return i < 0 ? 1e6 : i; };
  return list.map((e, n) => ({ ...e, n })).sort((a, b) => at(a.key) - at(b.key) || a.n - b.n);
}
async function saveFigs(pid, items, order) {
  const body = { items, order: order || figOrder(pid) };
  await state.db.collection("figures").doc(pid).set(body);
  state.figs[pid] = body; state.figsLoaded = true;
}
function figuresBlock(p) {
  state.figOrigin = origin(p)?.href || "";
  const base = p.figures || [], extra = onlineFigs(p.id);
  if (!base.length && !extra.length && !(state.isOwner && !p.locked)) return "";
  const canEdit = state.isOwner && !p.locked;
  const add = canEdit ? (state.addingFig === p.id ? figForm(p) : `<button class="btn fig-add" type="button" id="figadd">＋ 新增圖表</button>`) : "";
  const entries = figEntries(p);
  const cards = entries.map((e, pos) => e.online && state.addingFig === p.id && state.figEdit === e.idx ? figForm(p, e.fig)
    : figHtml(e.fig, e.idx, canEdit && e.online, canEdit && entries.length > 1 ? { pos, up: pos > 0, down: pos < entries.length - 1 } : null)).filter(Boolean);
  if (state.figEdit == null && add) cards.push(add);
  const n = base.length + extra.length;
  return `<details class="fold figs-wrap" id="s-figs" open><summary><h4>重點圖表${n ? `（${n}）` : ""}</h4><span class="chev" aria-hidden="true"></span></summary><div class="fold-body"><div class="figs">${cards.join("")}</div></div></details>`;
}
function figCite(p) {
  const first = (p.authors || "").split(",")[0].trim();
  const who = first ? `${first} et al., ` : "";
  const where = p.citation || [p.journal, p.year].filter(Boolean).join(" ");
  return `原文 Figure ＿（${who}${where}）`;
}
function figForm(p, fg) {
  const ed = !!fg, tsv = fg?.kind === "table" ? [fg.columns, ...(fg.rows || [])].map(r => (r || []).join("\t")).join("\n") : "";
  return `<form class="fig-form" id="figform">
    ${ed ? `<span class="chip" style="justify-self:start">編輯圖表</span>` : ""}
    <div class="row2"><div class="field"><label for="fg-kind">類型</label><select id="fg-kind" ${ed ? "disabled" : ""}><option value="image" ${fg?.kind === "image" ? "selected" : ""}>上傳圖片</option><option value="table" ${fg?.kind === "table" ? "selected" : ""}>貼上表格</option></select></div>
    <div class="field"><label for="fg-title">圖表標題</label><input id="fg-title" required value="${esc(fg?.title || "")}"></div></div>
    <div class="field" id="fg-filebox"><label for="fg-file">${ed ? "更換圖片 <span class=\"hint\">不選檔案就保留原本的圖片</span>" : "圖片檔 <span class=\"hint\">PNG / JPG，建議寬 1200 px 以內</span>"}</label>${ed && fg.kind === "image" ? `<img src="${esc(imgSrc(fg))}" alt="" style="max-height:120px;justify-self:start">` : ""}<input id="fg-file" type="file" accept="image/*"></div>
    <div class="field" id="fg-tablebox" hidden><label for="fg-table">表格內容 <span class="hint">可直接從 Excel 複製貼上；第一列為欄位名稱</span></label><textarea id="fg-table" rows="6">${esc(tsv)}</textarea></div>
    <div class="field"><label for="fg-cap">說明</label><textarea id="fg-cap" rows="3">${esc(fg?.caption || "")}</textarea></div>
    <div class="field"><label for="fg-src">資料來源 <span class="hint">${ed ? "圖號、作者、期刊與年份" : "已自動帶入這篇的出處，請把 ＿ 改成圖號"}</span></label><input id="fg-src" value="${esc(ed ? fg.source || "" : figCite(p))}"></div>
    <p class="fig-note">原文圖片請完整註明出處（圖號、作者、期刊與年份）；文章頁會在圖下方附上原文連結。</p>
    <div class="actions"><button class="btn primary" type="submit" id="fg-save">${ed ? "儲存修改" : "加入"}</button><button class="btn" type="button" id="fg-cancel">取消</button><span class="status" id="fg-status" role="status"></span></div>
  </form>`;
}
function wireFigs(p) {
  app.querySelectorAll("[data-zoom]").forEach(b => b.addEventListener("click", () => {
    const ov = document.createElement("div"); ov.className = "zoom-ov"; ov.setAttribute("role", "dialog"); ov.tabIndex = -1;
    ov.innerHTML = `<img src="${esc(b.dataset.zoom)}" alt=""><span>點任意處或按 Esc 關閉</span>`;
    const close = () => { ov.remove(); document.removeEventListener("keydown", key); b.focus(); };
    const key = e => { if (e.key === "Escape") close(); };
    ov.addEventListener("click", close); document.addEventListener("keydown", key);
    document.body.appendChild(ov); ov.focus();
  }));
  app.querySelector("#figadd")?.addEventListener("click", () => { state.addingFig = p.id; state.figEdit = null; paper(p.id); });
  app.querySelectorAll("[data-figedit]").forEach(b => b.addEventListener("click", () => { state.addingFig = p.id; state.figEdit = +b.dataset.figedit; paper(p.id); }));
  app.querySelectorAll("[data-figmove]").forEach(b => b.addEventListener("click", async () => {
    const keys = figEntries(p).map(e => e.key), i = +b.dataset.figmove, j = i + +b.dataset.dir;
    [keys[i], keys[j]] = [keys[j], keys[i]];
    b.disabled = true;
    try { await saveFigs(p.id, [...onlineFigs(p.id)], keys); paper(p.id); }
    catch { b.disabled = false; b.textContent = "移動失敗"; }
  }));
  app.querySelectorAll("[data-figdel]").forEach(b => b.addEventListener("click", async () => {
    if (!confirmDel(b)) return;
    const gone = figKey(onlineFigs(p.id)[+b.dataset.figdel], +b.dataset.figdel);
    const keys = figEntries(p).map(e => e.key).filter(k => k !== gone);
    const items = onlineFigs(p.id).filter((_, i) => i !== +b.dataset.figdel);
    try { await saveFigs(p.id, items, keys); paper(p.id); }
    catch { b.textContent = "刪除失敗，請再試一次"; }
  }));
  const form = app.querySelector("#figform"); if (!form) return;
  const kind = form.querySelector("#fg-kind"), st = form.querySelector("#fg-status");
  const say = (m, err) => { st.textContent = m; st.classList.toggle("err", !!err); };
  const editIdx = state.figEdit, old = editIdx != null ? onlineFigs(p.id)[editIdx] : null;
  if (!state.assets && !old) { kind.value = "table"; kind.querySelector('option[value="image"]').disabled = true; }
  const sync = () => { form.querySelector("#fg-filebox").hidden = kind.value !== "image"; form.querySelector("#fg-tablebox").hidden = kind.value !== "table"; };
  kind.addEventListener("change", sync); sync();
  form.querySelector("#fg-cancel").addEventListener("click", () => { state.addingFig = null; state.figEdit = null; paper(p.id); });
  form.scrollIntoView({ block: "nearest" });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!state.db) return say("目前連不到資料庫，請重新整理後再試。", true);
    const v = id => form.querySelector(id).value.trim();
    const item = { ...(old || {}), kind: old ? old.kind : kind.value, title: v("#fg-title"), caption: v("#fg-cap"), source: v("#fg-src"), ...(old ? { editedAt: new Date().toISOString() } : { addedAt: new Date().toISOString(), fid: "f" + Date.now().toString(36) }) };
    const btn = form.querySelector("#fg-save"); btn.disabled = true;
    try {
      if (item.kind === "image") {
        const file = form.querySelector("#fg-file").files[0];
        if (file) {
          if (!state.assets) { btn.disabled = false; return say("目前無法上傳圖片，請重新整理後再試。", true); }
          say("上傳中…");
          const up = await state.assets.upload(file);
          item.assetId = up.id; delete item.src;
        } else if (!old) { btn.disabled = false; return say("請先選擇圖片檔。", true); }
        item.alt = item.title;
      } else {
        const lines = v("#fg-table").split(/\r?\n/).filter(l => l.trim());
        const cells = l => (l.includes("\t") ? l.split("\t") : l.split(/\s*[|｜]\s*/)).map(c => c.trim());
        if (lines.length < 2) { btn.disabled = false; return say("表格至少需要一列欄位名稱與一列資料。", true); }
        item.columns = cells(lines[0]); item.rows = lines.slice(1).map(cells);
      }
      const items = [...onlineFigs(p.id)];
      if (old) items[editIdx] = item; else items.push(item);
      const keys = figEntries(p).map(e => e.key); if (!old) keys.push(item.fid);
      await saveFigs(p.id, items, keys);
      state.addingFig = null; state.figEdit = null; paper(p.id);
    } catch (err) { btn.disabled = false; say(err?.code === "quota_exceeded" ? "空間已滿，無法再新增。" : "儲存失敗，請稍後再試。", true); }
  });
}
const confirmDel = b => { if (b.dataset.armed) return true; b.dataset.armed = "1"; b.textContent = "再按一次確認刪除"; return false; };


// ---- Review lock: owner marks a paper as proofread; locked papers hide every edit control ----
const UNLOCK_CODE = "0000"; // guards against accidental edits only; writing is already owner-only
function lockBar(p) {
  if (p.locked) return `<div class="lockbar locked"><span>🔒 已校稿完成並鎖定${(state.review[p.id]?.at || p.reviewedAt) ? ` · ${esc(new Date(state.review[p.id]?.at || p.reviewedAt).toLocaleDateString("zh-TW"))}` : ""}</span>
    ${state.unlocking === p.id ? `<form id="unlockf" class="unlockf"><label for="unlock-code">輸入解鎖密碼</label><input id="unlock-code" inputmode="numeric" autocomplete="off" maxlength="12"><button class="btn primary" type="submit">解除鎖定</button><button class="btn" type="button" id="unlock-cancel">取消</button><span class="status" id="lock-status" role="status"></span></form>`
      : `<button class="btn" type="button" id="unlock">解除鎖定</button>`}</div>`;
  return `<div class="lockbar"><label class="check"><input type="checkbox" id="lockchk"> 校稿完成（摘要與圖表都已對照原文確認），鎖定這篇</label><span class="status" id="lock-status" role="status"></span></div>`;
}
function wireLock(p) {
  const st = () => app.querySelector("#lock-status");
  const save = async body => {
    if (!state.db) { st().textContent = "目前連不到資料庫，請重新整理後再試。"; st().classList.add("err"); return false; }
    try { await state.db.collection("review").doc(p.id).set(body); state.review[p.id] = body; state.reviewLoaded = true; return true; }
    catch { st().textContent = "儲存失敗，請稍後再試。"; st().classList.add("err"); return false; }
  };
  app.querySelector("#lockchk")?.addEventListener("change", async e => {
    e.target.disabled = true;
    if (await save({ reviewed: true, locked: true, at: new Date().toISOString() })) { state.addingFig = null; paper(p.id); }
    else { e.target.checked = false; e.target.disabled = false; }
  });
  app.querySelector("#unlock")?.addEventListener("click", () => { state.unlocking = p.id; paper(p.id); app.querySelector("#unlock-code")?.focus(); });
  app.querySelector("#unlock-cancel")?.addEventListener("click", () => { state.unlocking = null; paper(p.id); });
  app.querySelector("#unlockf")?.addEventListener("submit", async e => {
    e.preventDefault();
    const code = app.querySelector("#unlock-code");
    if (code.value.trim() !== UNLOCK_CODE) { st().textContent = "密碼不正確"; st().classList.add("err"); code.select(); return; }
    if (await save({ reviewed: false, locked: false, unlockedAt: new Date().toISOString() })) { state.unlocking = null; paper(p.id); }
  });
}



// ---- In-page jump bar: buttons (not links) so the hash router is never triggered ----
function jumpBar(p) {
  const hasFigs = (p.figures || []).length || onlineFigs(p.id).length;
  const items = [["s-key", "重點"], ["s-data", "數據", (p.keyResults || []).length], ["s-figs", "圖表", hasFigs], ["s-authors", "作者解釋", p.authorsView], ["s-implication", "臨床推論", p.clinical || p.application]]
    .filter(i => i.length < 3 || i[2]);
  return `<nav class="jump" aria-label="跳到段落">${items.map(([id, label]) => `<button type="button" data-jump="${id}">${label}</button>`).join("")}<button type="button" class="jump-all" id="foldall" aria-label="全部展開或收合">全部展開</button></nav>`;
}
function wireJump() {
  const all = app.querySelector("#foldall");
  const blocks = () => [...app.querySelectorAll("details.fold, details.layer")];
  const sync = () => { if (all) all.textContent = blocks().every(d => d.open) ? "全部收合" : "全部展開"; };
  blocks().forEach(d => d.addEventListener("toggle", sync)); sync();
  all?.addEventListener("click", () => { const open = !blocks().every(d => d.open); blocks().forEach(d => { d.open = open; }); sync(); });
  app.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => {
    const el = document.getElementById(b.dataset.jump); if (!el) return;
    openTo(el);
    const bar = app.querySelector(".jump");
    const y = el.getBoundingClientRect().top + window.scrollY - (bar ? bar.offsetHeight + 12 : 12);
    window.scrollTo({ top: y, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }));
}

function editor(p, c, s) {
  const lines = a => (a || []).join("\n");
  const f = (id, label, val, opts = {}) => `<div class="field${opts.big ? " big" : ""}"><label for="f-${id}">${label}${opts.hint ? ` <span class="hint">${opts.hint}</span>` : ""}</label>${opts.input ? `<input id="f-${id}" value="${esc(val)}">` : `<textarea id="f-${id}" rows="${opts.rows || 3}">${esc(val)}</textarea>`}</div>`;
  app.innerHTML = `
    <nav class="crumbs"><a href="#home">首頁</a><span>›</span><a href="#c${c.id}">${esc(c.zh)}</a><span>›</span><span>${esc(s.en)}</span></nav>
    <article class="sheet">
      <div class="sheet-head"><span class="chip" style="justify-self:start">編輯摘要</span><h1>${esc(p.titleZh || p.title)}</h1><div class="orig"><span>原文標題</span>${esc(p.title)}</div></div>
      <form class="sheet-body editor" id="form">
        ${f("titleZh", "中文標題", p.titleZh, { input: true, hint: "列表與文章頁顯示的標題" })}
        <div style="display:flex;gap:20px;flex-wrap:wrap"><label class="check"><input type="checkbox" id="f-must" ${p.mustRead ? "checked" : ""}> 設為這個子主題的必讀文章</label></div>
        ${f("conclusion", "一句話重點", p.conclusion, { big: true, rows: 2 })}
        <div class="row2">${f("studyType", "研究類型", p.studyType, { input: true })}${f("n", "樣本數", p.n, { input: true })}</div>
        <div class="row2">${f("authors", "作者", p.authors, { input: true })}${f("journal", "期刊", p.journal, { input: true })}</div>
        <div class="row2">${f("citation", "引用格式", p.citation, { input: true })}${f("doi", "DOI", cleanDoi(p.doi), { input: true, hint: "只填號碼，例如 10.1097/…" })}</div>
        ${f("url", "原文網址", p.url || (isUrl(cleanDoi(p.doi)) ? cleanDoi(p.doi) : ""), { input: true, hint: "沒有 DOI 時填，例如學會網頁、CRST、EyeNet 文章；有填時優先使用" })}
        ${f("tags", "標籤", (p.tags || []).join("、"), { input: true, hint: "用頓號或逗號分隔" })}
        <h3 class="ed-layer">1 · 文獻實際結果（Evidence）<span>只寫原文的事實與數字</span></h3>
        ${f("about", "研究設計", p.about || p.design, { rows: 4 })}
        ${f("keyResults", "主要數據", lines(p.keyResults), { rows: 6, hint: "一行一點，保留原始數字" })}
        ${f("limitations", "研究限制", lines(p.limitations), { rows: 4, hint: "一行一點" })}
        <h3 class="ed-layer">2 · 作者解釋（Authors' Interpretation）<span>原文作者的結論與建議</span></h3>
        ${f("authorsView", "作者解釋", p.authorsView, { rows: 4 })}
        <h3 class="ed-layer">3 · 臨床實務推論（Clinical Implication）<span>保守推論，避免超出原文</span></h3>
        ${f("clinical", "臨床實務推論", p.clinical || p.application, { rows: 4 })}
        <div class="actions">
          <button class="btn primary" type="submit" id="save">儲存</button>
          <button class="btn" type="button" id="cancel">取消</button>
          ${state.overrides[p.id] ? '<button class="btn ghost-danger" type="button" id="revert">還原成原始版本</button>' : ""}
          <span class="status" id="status" role="status"></span>
        </div>
      </form>
    </article>`;
  const status = app.querySelector("#status");
  const say = (t, err) => { status.textContent = t; status.classList.toggle("err", !!err); };
  const split = v => v.split("\n").map(x => x.trim()).filter(Boolean);
  const val = id => app.querySelector(`#f-${id}`).value.trim();
  const done = () => { state.editing = null; paper(p.id); };
  app.querySelector("#cancel").addEventListener("click", done);
  app.querySelector("#form").addEventListener("submit", async e => {
    e.preventDefault();
    if (!state.db) return say("目前連不到資料庫，無法儲存。請重新整理頁面後再試。", true);
    const body = {
      titleZh: val("titleZh") || p.titleZh,
      mustRead: app.querySelector("#f-must").checked,
      authors: val("authors"), journal: val("journal"), citation: val("citation"), doi: isUrl(cleanDoi(val("doi"))) ? "" : cleanDoi(val("doi")), url: val("url") || (isUrl(cleanDoi(val("doi"))) ? cleanDoi(val("doi")) : ""),
      studyType: val("studyType"), n: val("n"), tags: val("tags").split(/[、,，]/).map(t => t.trim()).filter(Boolean),
      conclusion: val("conclusion"), about: val("about"), keyResults: split(val("keyResults")),
      limitations: split(val("limitations")), authorsView: val("authorsView"), clinical: val("clinical"),
      updatedAt: new Date().toISOString(),
    };
    const btn = app.querySelector("#save"); btn.disabled = true; say("儲存中…");
    try {
      await state.db.collection("summaries").doc(p.id).set(body);
      state.overrides[p.id] = body; done();
    } catch (err) {
      btn.disabled = false;
      say(err?.code === "invalid_argument" ? "沒有儲存權限，只有網站擁有者可以修改。" : err?.code === "quota_exceeded" ? "資料庫空間已滿，無法再新增。" : "儲存失敗，請稍後再按一次儲存。", true);
    }
  });
  app.querySelector("#revert")?.addEventListener("click", async () => {
    const btn = app.querySelector("#revert"); btn.disabled = true; say("還原中…");
    try { await state.db.collection("summaries").doc(p.id).delete(); delete state.overrides[p.id]; done(); }
    catch { btn.disabled = false; say("還原失敗，請稍後再試。", true); }
  });
}

function search(term) {
  hero(false);
  q2.value = term;
  if (document.activeElement !== q2) { q2.focus(); q2.setSelectionRange(term.length, term.length); }
  const t = term.toLowerCase();
  const hay = p => [p.titleZh, p.title, state.priv[p.id]?.label, p.authors, p.journal, (p.tags || []).join(" "), p.conclusion, p.about || p.design, (p.keyResults || []).join(" "), p.clinical || p.application, p.authorsView].join(" ").toLowerCase();
  const list = all().filter(p => hay(p).includes(t)).sort(byYear);
  app.innerHTML = `
    <nav class="crumbs"><a href="#home">首頁</a><span>›</span><span>搜尋</span></nav>
    <div class="sec-head"><h2>「${esc(term)}」找到 ${list.length} 篇</h2></div>
    <div class="list">${list.length ? list.map(item).join("") : '<div class="empty">沒有找到符合的文獻。可以換個關鍵字，或用英文試試，例如 Yamane、toric、PCO。</div>'}</div>`;
}

let lastCat = null;
function route() {
  const h = location.hash.slice(1) || "home";
  if (h !== state.editing) state.editing = null;
  if (h !== state.addingFig) { state.addingFig = null; state.figEdit = null; }
  if (h !== state.unlocking) state.unlocking = null;
  state.editingIntro = null;
  if (h === "search") return state.query.trim() ? search(state.query.trim()) : home();
  if (h.startsWith("c")) {
    const [cid, sid] = h.slice(1).split("-");
    state.sub = sid || null; // the hash always mirrors the open subtopic (tabs update it via replaceState)
    lastCat = cid; return category(cid);
  }
  if (h.startsWith("p")) return paper(h);
  return home();
}
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); route(); });
q2.addEventListener("input", () => { state.query = q2.value; if (q2.value.trim()) { if (location.hash !== "#search") location.hash = "#search"; else search(q2.value.trim()); } });
document.addEventListener("input", e => { if (e.target.id === "q" && location.hash === "#search") search(state.query.trim()); });
route();

// Live features: owner editing + shared summaries. The page works without them.
(async () => {
  if (READER || !window.claude?.use) return;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  state.isOwner = user ? Boolean(await user.isOwner()) : false;
  if (state.isOwner) document.getElementById("mode").innerHTML = '<span class="mode">編輯模式</span>';
  if (!db) { if (state.isOwner) route(); return; }
  state.db = db;
  db.collection("summaries").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.overrides = next;
    if (!state.editing && !state.editingIntro && !state.addingFig) route();
  }, () => {});
  if (state.isOwner) db.collection("private").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.priv = next;
    if (!state.editing && !state.editingIntro && !state.addingFig) route();
  }, () => {});
  db.collection("review").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.review = next; state.reviewLoaded = true;
    if (!state.editing && !state.editingIntro && !state.addingFig && !state.unlocking) route();
  }, () => {});
  db.collection("figures").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.figs = next; state.figsLoaded = true;
    if (!state.editing && !state.editingIntro && !state.addingFig) route();
  }, () => {});
  if (state.isOwner) claude.use("assets").then(a => { state.assets = a; if (state.addingFig) route(); }).catch(() => {});
  db.collection("intros").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    state.intros = next;
    if (!state.editing && !state.editingIntro && !state.addingFig) route();
  }, () => {});
  if (state.isOwner) route();
})();
</script>
